<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapehead Studio - Premium Console Workspace</title>
    <style>
        :root {
            --bg-color: #121212;
            --console-chassis: #1e1d1a; 
            --strip-color: #2b2925; 
            --tape-gold: #c5a880; 
            --accent-blue: #3a9fc0;
            --fader-cap: #f2ede4;
            --tape-red: #ff4d4d;
            --tape-green: #5cb85c;
        }

        body {
            background-color: var(--bg-color);
            color: #f5f0e6;
            font-family: 'Courier New', Courier, monospace; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        /* Dashboard Header Component */
        .studio-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 3px double var(--tape-gold);
            padding-bottom: 10px;
            width: 95%;
            max-width: 900px;
        }

        .studio-header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 4px;
            color: var(--tape-gold);
            text-shadow: 0 0 10px rgba(197, 168, 128, 0.3);
            text-transform: uppercase;
        }

        #global-status {
            color: #8a8377;
            font-weight: bold;
            margin-top: 6px;
            font-size: 11px;
        }

        /* Top Module Workspace Rack (Side-by-Side Grid) */
        .workspace-rack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
            width: 95%;
            max-width: 900px;
        }

        .studio-panel {
            background: var(--strip-color);
            border: 2px solid #3d3a35;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-title {
            margin-top: 0;
            color: var(--tape-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 12px;
            border-bottom: 1px dashed #4d473e;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .genre-select {
            width: 100%;
            background: #181715;
            border: 1px solid #4d473e;
            color: #f5f0e6;
            padding: 6px;
            font-family: inherit;
            font-size: 11px;
            margin-bottom: 8px;
            outline: none;
        }

        .engine-btn {
            padding: 10px 15px;
            color: #121212;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
            width: 100%;
            margin-top: 5px;
        }

        .engine-btn:hover { opacity: 0.9; }

        .record-mode { background: var(--tape-red); color: white; }
        .generate-mode { background: var(--tape-gold); }

        .lyrics-input {
            width: 100%;
            height: 52px;
            background: #181715;
            border: 1px solid #4d473e;
            color: #f5f0e6;
            border-radius: 2px;
            padding: 6px;
            font-family: inherit;
            font-size: 11px;
            resize: none;
            margin-bottom: 8px;
            outline: none;
        }

        .display-box {
            margin-top: 5px;
            font-size: 10px;
            color: #aaa49a;
            min-height: 24px;
            line-height: 1.3;
            background: #181715;
            padding: 6px;
            border-radius: 2px;
        }

        .highlight-text {
            font-weight: bold;
            color: #fff;
        }

        /* Mixer Console Unit */
        .mixer-console {
            background-color: var(--console-chassis);
            border: 6px solid #141312;
            border-radius: 4px;
            padding: 15px 10px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            width: 95%;
            max-width: 900px;
            justify-content: space-between;
        }

        /* Vertical Channel Fader Strips */
        .channel-strip {
            background-color: var(--strip-color);
            flex: 1;
            margin: 0 4px;
            padding: 10px 4px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid #3d3a35;
            border-right: 1px solid #1c1b19;
            min-width: 0;
        }

        .channel-name {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #121212;
            background: var(--tape-gold);
            padding: 4px 2px;
            border-radius: 1px;
            width: 90%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Rotary Pan Unit Parameter Controls */
        .pan-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 8px;
            color: #8c8579;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .pan-slider {
            width: 60px;
            margin-top: 4px;
        }

        /* Fader Mechanical Rail Track Assemblies */
        .fader-container {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 12px;
            width: 100%;
        }

        .fader-slider {
            -webkit-appearance: none;
            appearance: none;
            transform: rotate(-90deg);
            width: 150px;
            height: 5px;
            background: #121212;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        /* Mechanical Hardware Fader Knobs */
        .fader-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 26px;
            background: var(--fader-cap);
            border-radius: 1px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            border-left: 2px solid #7a756c;
            border-right: 2px solid #7a756c;
            border-top: 2px solid #333;
            border-bottom: 2px solid #333;
        }

        .btn-group {
            display: flex;
            gap: 3px;
            margin-bottom: 5px;
            width: 90%;
        }

        .mixer-btn {
            background: #181715;
            border: 1px solid #4d473e;
            color: var(--tape-gold);
            font-family: inherit;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 0;
            cursor: pointer;
            border-radius: 2px;
            flex: 1;
            text-align: center;
        }

        .mixer-btn.active-mute { background: var(--tape-red); color: white; border-color: var(--tape-red); }

        /* Console Master Output Strip Staging */
        .master-section {
            border-left: 3px double #4d473e;
            margin-left: 8px;
            padding-left: 4px;
        }
        
        .master-section .channel-name {
            background: #f5f0e6;
            color: #121212;
        }
    </style>
</head>
<body>

    <!-- Header Frame -->
    <div class="studio-header">
        <h1>Tapehead Studio</h1>
        <div id="global-status">SYSTEM STATUS: READY TO BOOT (Click an action engine button to initialize vacuum tubes)</div>
    </div>

    <!-- Active Production Engines Row -->
    <div class="workspace-rack">
        <!-- MODULE 1: Hum to Chord Engine -->
        <div class="studio-panel">
            <div>
                <h3 class="panel-title">1. Hum-to-Chord Engine</h3>
                <select class="genre-select" id="genre-select">
                    <optgroup label="African Genres (7)">
                        <option value="afrobeats">Afrobeats (Pentatonic Progressions)</option>
                        <option value="amapiano">Amapiano (Jazz Minor 7th Layers)</option>
                        <option value="highlife">Highlife (Guitar Progressions)</option>
                        <option value="bongoflava">Bongo Flava (Afro R&B Polyrhythms)</option>
                        <option value="gengetone">Gengetone (Bass Clusters)</option>
                        <option value="coupedecale">Coupé-Décalé (Fast Cadences)</option>
                        <option value="kwaito">Kwaito (Deep House Pads)</option>
                    </optgroup>
                    <optgroup label="Western Genres (7)">
                        <option value="pop">Pop (Catchy Hooks)</option>
                        <option value="hiphop">Hip-Hop (Trap Frameworks)</option>
                        <option value="synthwave">Synthwave (Vintage Retro Waves)</option>
                        <option value="rnb">R&B (Smooth Major/Minor 9ths)</option>
                        <option value="rock">Rock (Root Power-Chords)</option>
                        <option value="house">House (Classic 4x4 Triads)</option>
                        <option value="jazz">Jazz (Extended Modals)</option>
                    </optgroup>
                </select>
