<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tapehead — Genres from Code 1 • All Premium Visible</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F0E9D9;--panel:#FBF8F0;--panel2:#E9E0C9;--line:#D8CBA6;--text:#2B2415;--dim:#7C7156;--indigo:#6366F1;--cyan:#06B6D4;--font-d:'Fraunces',serif;--font-b:'Inter',sans-serif;--font-m:'JetBrains Mono',monospace}
:root[data-theme="dark"]{--bg:#0A0A0C;--panel:#16161A;--panel2:#1C1C20;--line:#232326;--text:#F8FAFC;--dim:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font-b)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--panel2);padding:16px;display:flex;flex-direction:column;gap:12px}
.top{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}.tab{padding:7px 12px;border-radius:7px;border:none;background:none;color:var(--dim);cursor:pointer}.tab.on{background:var(--indigo);color:#fff}
.view{padding:18px 20px 80px} [hidden]{display:none!important}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-b{padding:12px 14px}
.lyrics{width:100%;min-height:300px;border:none;background:none;resize:vertical;font-size:15px;line-height:1.7;outline:none}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}.btn.pri{background:var(--indigo);color:#fff;border-color:var(--indigo);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-m);font-size:10px;cursor:pointer}.chip.on{background:var(--indigo);color:#fff}
.piano{position:relative;height:84px;display:flex;margin:10px 0}.pkey{flex:1;border:1px solid var(--line);border-left:none;background:var(--panel);border-radius:0 0 8px 8px;display:flex;align-items:end;justify-content:center;padding-bottom:6px;font-size:11px;cursor:pointer}.pkey.on{background:var(--indigo);color:#fff}.bkey{position:absolute;top:0;width:28px;height:52px;background:#0A0A0C;border-radius:0 0 6px 6px;z-index:2}
.mixer{background:rgba(14,14,16,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mix-head{padding:10px 12px;background:linear-gradient(180deg,#1C1C20,#121214);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);color:#F8FAFC}
.transport{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#121214;border-bottom:1px solid var(--line);color:#F8FAFC}
.play{width:44px;height:44px;border-radius:50%;background:var(--indigo);color:#fff;border:none;font-weight:900;cursor:pointer}

.track{display:grid;grid-template-columns:92px 56px 1fr;gap:8px;padding:8px 10px;border-top:1px solid #1E1E20;align-items:center}

</style>
</head>

</section>

<section class="view" id="studioView" hidden>
<div class="card"><div class="card-b"><div id="piano" class="piano"></div><div id="chordList" class="chips" style="margin-top:10px"></div><div id="progInfo" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px"></div></div></div>
<div class="card mixer">
<div class="mix-head"><b id="kitName">Premium Mixer — Genres from Code 1</b><span id="kitDesc" style="font-family:var(--font-m);font-size:7px;background:#0A0A0C;padding:5px 8px;border-radius:999px;border:1px solid var(--line)">ALL WRITINGS VISIBLE</span></div>
<div class="transport"><button class="play" id="playBtn">▶</button><div><div id="bpmLabel" style="font-weight:700">96 BPM</div><div id="instLabel" style="font-family:var(--font-m);font-size:7px;color:#94A3B8">MASTER BUS • COMP • REVERB • DELAY • TUNED TO MELODY • SATURATION</div></div><div style="margin-left:auto;display:flex;gap:8px"><input id="revSend" type="range" min="0" max="100" value="22" class="fader"><input id="masterFilt" type="range" min="0" max="100" value="100" class="fader"></div></div>
<div class="genre-section"><div class="genre-label">GENRES FROM CODE 1 • ORIGINAL PREMIUM SET • 12 GENRES • AFRICAN + WESTERN</div><div class="genre-row" id="afroRow"></div><div class="genre-row" id="westRow"></div></div>
<div id="tracks"></div>
<canvas id="wave" width="400" height="34" style="width:100%;height:34px;background:#0A0A0C"></canvas>
</div>
</section>

<section class="view" id="publishView" hidden>
<div class="card" style="max-width:560px;margin:0 auto"><div class="card-b"><canvas id="pubWave" class="wave" style="height:90px"></canvas><div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="renderDemo">Render Demo</button><button class="btn" id="dlDemo" disabled>Download</button></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="waShare" style="background:#25D366;color:#000">WhatsApp</button><button class="btn" id="copyAll">Copy</button></div><div id="pubStat" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px"></div></div></div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>

const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DIATONIC=[{rn:'I',n:'C',notes:['C','E','G']},{rn:'ii',n:'Dm',notes:['D','F','A']},{rn:'iii',n:'Em',notes:['E','G','B']},{rn:'IV',n:'F',notes:['F','A','C']},{rn:'V',n:'G',notes:['G','B','D']},{rn:'vi',n:'Am',notes:['A','C','E']},{rn:'vii°',n:'Bdim',notes:['B','D','F']}];
let curGenre='Afrobeats',curKit=KITS[curGenre],curBpm=96,activeIdx=0,melody=[],pattern={},vol={},mute={},solo={},isPlaying=false,timer=null,stepPos=0,aCtx,master,comp,revNode,delayNode,masterFilt,noiseBuf;

function initAudio(){ if(aCtx) return; aCtx=new (window.AudioContext||window.webkitAudioContext)(); noiseBuf=aCtx.createBuffer(1,aCtx.sampleRate,aCtx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; master=aCtx.createGain(); master.gain.value=.88; comp=aCtx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=.003; comp.release.value=.22; const sat=aCtx.createWaveShaper(); const n=44100,c=new Float32Array(n); for(let i=0;i<n;i++){const x=i*2/n-1; c[i]=(3+2.2)*x*20*Math.PI/180/(Math.PI+2.2*Math.abs(x))} sat.curve=c; sat.oversample='4x'; masterFilt=aCtx.createBiquadFilter(); masterFilt.type='lowpass'; masterFilt.frequency.value=20000; revNode=aCtx.createConvolver(); const len=aCtx.sampleRate*2.8; const imp=aCtx.createBuffer(2,len,aCtx.sampleRate); for(let ch=0;ch<2;ch++){const dat=imp.getChannelData(ch); for(let i=0;i<len;i++) dat[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*.55} revNode.buffer=imp; const rg=aCtx.createGain(); rg.gain.value=.22; const rf=aCtx.createBiquadFilter(); rf.frequency.value=4200; revNode.connect(rf); rf.connect(rg); rg.connect(comp); delayNode=aCtx.createDelay(1); delayNode.delayTime.value=.34; const dg=aCtx.createGain(); dg.gain.value=.16; delayNode.connect(dg); dg.connect(comp); master.connect(sat); sat.connect(masterFilt); masterFilt.connect(comp); comp.connect(aCtx.destination); document.getElementById('revSend').oninput=e=>rg.gain.value=e.target.value/100; document.getElementById('masterFilt').oninput=e=>masterFilt.frequency.value=200+(e.target.value/100)*18000; }

if(name.includes('Kick')){const sub=aCtx.createOscillator(),cl=aCtx.createOscillator(),g=aCtx.createGain(),cg=aCtx.createGain(); let sf=130,ef=38,dec=.52,cf=2800; if(s.kick==='deep'){sf=88;ef=30;dec=.74;cf=1200} if(s.kick==='hard'){sf=170;ef=28;dec=.44;cf=4200} if(s.kick==='warm'){sf=100;ef=42;dec=.62} sub.frequency.setValueAtTime(sf,t); sub.frequency.exponentialRampToValueAtTime(ef,t+dec); g.gain.setValueAtTime(v*1.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dec+.15); cl.frequency.value=cf; cg.gain.setValueAtTime(v*.18,t); cg.gain.exponentialRampToValueAtTime(.001,t+.04); sub.connect(g); cl.connect(cg); g.connect(dest); cg.connect(dest); sub.start(t); cl.start(t); sub.stop(t+dec+.2); cl.stop(t+.06); return;}

if(name.includes('Log')||name.includes('Bongo')||name.includes('Conga')){const base=tuned||60; const o=aCtx.createOscillator(),o2=aCtx.createOscillator(),g=aCtx.createGain(),fi=aCtx.createBiquadFilter(); o.type='sine'; o2.type='triangle'; o.frequency.setValueAtTime(midiFreq(base-12),t); o2.frequency.setValueAtTime(midiFreq(base-12)*1.007,t); const fm=aCtx.createOscillator(),fg=aCtx.createGain(); fm.frequency.value=midiFreq(base-12)*(s.log==='fm'?1.51:s.log==='dist'?2.3:1.25); fg.gain.value=s.log==='dist'?380:s.log==='fm'?260:140; fm.connect(fg); fg.connect(o.frequency); fi.type='lowpass'; fi.frequency.value=s.log==='deep'?680:s.log==='dist'?1100:950; g.gain.setValueAtTime(v*.88,t); g.gain.exponentialRampToValueAtTime(.001,t+.72); o.connect(fi); o2.connect(fi); fi.connect(g); g.connect(dest); g.connect(revNode); fm.start(t); o.start(t); o2.start(t); fm.stop(t+.32); o.stop(t+.76); o2.stop(t+.76); return;}
if(name.includes('Hi-hat')||name.includes('Shaker')||name.includes('Hat')){const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),g=aCtx.createGain(); f.type='highpass'; f.frequency.value=7200; g.gain.setValueAtTime(v*.26,t); g.gain.exponentialRampToValueAtTime(.001,t+.09); b.connect(f); f.connect(g); g.connect(dest); b.start(t); b.stop(t+.11); return;}
if(name.includes('Bass')||name.includes('808')){const base=36+NOTES.indexOf(cur.key)+(melody[0]%5||0); const o=aCtx.createOscillator(),g=aCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(midiFreq(base),t); g.gain.setValueAtTime(v*.95,t); g.gain.exponentialRampToValueAtTime(.001,t+1.1); o.connect(g); g.connect(dest); o.start(t); o.stop(t+1.15); return;}
const d=DIATONIC[activeIdx]; (d.notes||['C','E','G']).forEach((nn,i)=>{const o=aCtx.createOscillator(),g=aCtx.createGain(),fi=aCtx.createBiquadFilter(); const map={C:60,D:62,E:64,F:65,G:67,A:69,B:71}; o.type=s.log==='rhodes'?'sine':'triangle'; o.frequency.value=midiFreq((map[nn]||60)+12); fi.type='lowpass'; fi.frequency.setValueAtTime(4200,t); fi.frequency.exponentialRampToValueAtTime(1200,t+1.2); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.14,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+1.3); o.connect(fi); fi.connect(g); g.connect(dest); g.connect(delayNode); o.start(t+i*.02); o.stop(t+1.35);});}
function genPattern(seed,genre,mel){const r=seeded(seed); const root=60+NOTES.indexOf(cur.key); const pat={}; curKit.tracks.forEach(t=>{let p=new Array(16).fill(0); const n=t.split('\n')[0]; if(n.includes('Kick')){p[0]=1;p[8]=1; if(r()>.55)p[10]=1; if(genre==='House'){p=new Array(16).fill(0);p[0]=1;p[4]=1;p[8]=1;p[12]=1}} else if(n.includes('Snare')||n.includes('Clap')||n.includes('Rim')){p[4]=1;p[12]=1} else if(n.includes('Log')||n.includes('Bongo')||n.includes('Conga')){const iv=mel?.length?mel.slice(0,4).map(m=>(m-root+12)%12):[0,3,7,10]; [0,3,6,10,14].forEach(st=>{if(r()>.28)p[st]=1}); p.tuning=iv} else if(n.includes('Hi-hat')||n.includes('Shaker')||n.includes('Hat')){for(let i=0;i<16;i++)if(r()>.46)p[i]=1} else if(n.includes('Bass')){p[0]=1;p[8]=1;p.root=root-24} else{for(let i=0;i<16;i+=4)if(r()>.45)p[i]=1} pat[t]=p; vol[t]=n.includes('Kick')?.92:n.includes('Log')?.86:n.includes('Bass')?.88:.66; mute[t]=false; solo[t]=false;}); return pat;}
function initMixer(){const sum=(cur.melody||melody||[]).join(',')+cur.title+cur.key+document.getElementById('writer').value; const pat=genPattern(hash(sum),curGenre,cur.melody||melody); pattern=pat; renderMixer(); document.getElementById('kitDesc').textContent=`FROM CODE 1 • ${curGenre.toUpperCase()} • KEY ${cur.key} • BPM ${curBpm} • SEED ${hash(sum).toString().slice(0,6)} • ${curKit.desc}`;}
function renderMixer(){const wrap=document.getElementById('tracks'); wrap.innerHTML=''; curKit.tracks.forEach(t=>{const name=t.split('\n')[0]; const bus=(t.split('\n')[1]||'').toUpperCase(); const desc=(t.split('\n')[2]||'').toUpperCase(); const row=document.createElement('div'); row.className='track'; row.innerHTML=`<div class="t-meta"><b>${name}</b><span class="bus">${bus}</span><div class="desc">${desc}</div></div><div style="display:flex;flex-direction:column;gap:3px"><button class="btn" id="m${name.replace(/\W/g,'')}" onclick="togM('${t}')" style="padding:3px 6px;font-size:9px">M</button><button class="btn" id="s${name.replace(/\W/g,'')}" onclick="togS('${t}')" style="padding:3px 6px;font-size:9px">S</button></div><div style="display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:center"><div class="steps" id="st${name.replace(/\W/g,'')}"></div><div style="display:flex;gap:6px;align-items:center"><input type="range" class="fader" value="${(vol[t]||.66)*100}" oninput="vol['${t}']=this.value/100"><div class="meter"><div class="meter-fill" id="mt${name.replace(/\W/g,'')}"></div></div></div></div>`; wrap.appendChild(row); const sg=row.querySelector('#st'+name.replace(/\W/g,'')); for(let i=0;i<16;i++){const s=document.createElement('div'); s.className='st'; if(pattern[t][i]) s.classList.add('on'); s.onclick=()=>{pattern[t][i]=pattern[t][i]?0:1; s.classList.toggle('on')}; sg.appendChild(s);}});}
function togM(t){mute[t]=!mute[t]; toast(mute[t]?'MUTE':'UNMUTE')} function togS(t){solo[t]=!solo[t]; toast(solo[t]?'SOLO':'UNSOLO')}
function renderPiano(){const p=document.getElementById('piano'); p.innerHTML=''; ['C','D','E','F','G','A','B'].forEach(n=>{const d=document.createElement('div'); d.className='pkey'+(cur.key===n?' on':''); d.textContent=n; d.onclick=()=>{activeIdx=['C','D','E','F','G','A','B'].indexOf(n); upd()}; p.appendChild(d);});}
function renderChords(){const el=document.getElementById('chordList'); el.innerHTML=''; DIATONIC.forEach((d,i)=>{const b=document.createElement('div'); b.className='chip'+(i===activeIdx?' on':''); b.textContent=`${d.rn} ${d.n}`; b.onclick=()=>{activeIdx=i; upd()}; el.appendChild(b);}); const wc=document.getElementById('writeChips'); wc.innerHTML=''; DIATONIC.slice(0,4).forEach(d=>{const c=document.createElement('div'); c.className='chip'; c.textContent=`[${d.n}]`; c.onclick=()=>{document.getElementById('lyrics').value+=` [${d.n}]`; saveCur()}; wc.appendChild(c);});}
function upd(){const d=DIATONIC[activeIdx]; document.getElementById('progInfo').textContent=`${d.rn}/${d.n}: ${d.notes.join(' - ')} • ${curKit.desc} • Code 1 genre • premium`; document.getElementById('bpmLabel').textContent=`${curBpm} BPM • ${d.rn}/${d.n} • ${curGenre} FROM CODE 1`;}
function tick(){stepPos=(stepPos+1)%16; const tuned=60+NOTES.indexOf(cur.key)+(melody[stepPos%Math.max(1,melody.length)]||0)%12; curKit.tracks.forEach(t=>{const pat=pattern[t]||[]; if(pat[stepPos]){let tu=pat.root||tuned; if((t.includes('Log')||t.includes('Bongo'))&&pat.tuning){const iv=pat.tuning[stepPos%pat.tuning.length]||0; tu=60+NOTES.indexOf(cur.key)+iv} playChannel(t,tu); const m=document.getElementById('mt'+t.split('\n')[0].replace(/\W/g,'')); if(m) m.style.width=(60+Math.random()*40)+'%'}}); const c=document.getElementById('wave'),x=c.getContext('2d'); if(c){x.clearRect(0,0,c.width,c.height); x.strokeStyle='#6366F1'; x.beginPath(); for(let i=0;i<c.width;i++){const y=Math.sin(i*.06+stepPos*.6)*6; i===0?x.moveTo(i,17+y):x.lineTo(i,17+y);} x.stroke();}}
function togglePlay(){initAudio(); if(aCtx.state==='suspended') aCtx.resume(); if(isPlaying){clearInterval(timer); isPlaying=false; document.getElementById('playBtn').textContent='▶'; return;} isPlaying=true; document.getElementById('playBtn').textContent='■'; stepPos=0; timer=setInterval(tick,60000/curBpm/4);}
document.getElementById('playBtn').onclick=togglePlay;
function buildGenres(){const keySel=document.getElementById('keySel'); NOTES.forEach(n=>{const o=document.createElement('option'); o.value=n; o.textContent=n; keySel.appendChild(o);}); keySel.value=cur.key; const afro=document.getElementById('afroRow'), west=document.getElementById('westRow'); afro.innerHTML=''; west.innerHTML=''; Object.keys(KITS).forEach(k=>{const b=document.createElement('button'); b.className='chip'+(k===curGenre?' on':''); b.textContent=k; b.title=KITS[k].desc; b.onclick=()=>setGenre(k); if(KITS[k].region==='african') afro.appendChild(b); else west.appendChild(b);});}
function setGenre(g){curGenre=g; curKit=KITS[g]; curBpm=curKit.bpm; document.getElementById('bpm').value=curBpm; document.querySelectorAll('.chip').forEach(c=>{if(Object.keys(KITS).includes(c.textContent)) c.classList.toggle('on',c.textContent===g);}); initMixer(); upd(); toast(g+' FROM CODE 1');}
document.getElementById('keySel').onchange=e=>{cur.key=e.target.value; initMixer(); upd(); saveCur();}; document.getElementById('bpm').onchange=e=>{curBpm=parseInt(e.target.value)||96; if(isPlaying){clearInterval(timer); timer=setInterval(tick,60000/curBpm/4);} saveCur(); upd();};
function saveCur(){const s=songs.find(x=>x.id===activeId); if(!s) return; s.title=document.getElementById('title').value; s.lyrics=document.getElementById('lyrics').value; s.key=document.getElementById('keySel').value; s.bpm=parseInt(document.getElementById('bpm').value)||96; s.melody=melody; save(); renderList();}
function renderList(){const q=document.getElementById('search').value.toLowerCase(); const list=document.getElementById('songList'); list.innerHTML=''; songs.filter(s=>s.title.toLowerCase().includes(q)).forEach(s=>{const r=document.createElement('div'); r.style.cssText='padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:13px'; r.textContent=s.title; if(s.id===activeId) r.style.borderColor='#6366F1'; r.onclick=()=>{activeId=s.id; cur=s; document.getElementById('title').value=s.title; document.getElementById('lyrics').value=s.lyrics; document.getElementById('keySel').value=s.key; document.getElementById('bpm').value=s.bpm; curBpm=s.bpm; melody=s.melody||[]; initMixer(); renderPiano(); renderChords(); upd(); renderList();}; list.appendChild(r);});}
document.getElementById('title').oninput=saveCur; document.getElementById('lyrics').oninput=saveCur; document.getElementById('search').oninput=renderList;
document.getElementById('newBtn').onclick=()=>{const ns={id:uid(),title:'Untitled',lyrics:'',key:'C',bpm:96,melody:[]}; songs.unshift(ns); activeId=ns.id; cur=ns; save(); renderList(); document.getElementById('title').value=ns.title; document.getElementById('lyrics').value=''; melody=[]; initMixer();};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); b.classList.add('on'); document.querySelectorAll('.view').forEach(v=>v.hidden=true); document.getElementById(b.dataset.tab+'View').hidden=false;});
document.getElementById('genMelody').onclick=()=>{const words=document.getElementById('lyrics').value.split(/\s+/).filter(Boolean).slice(0,32); const ki=NOTES.indexOf(cur.key); const sc=[0,2,4,5,7,9,11]; melody=words.map((w,i)=>60+ki+sc[(i*2)%sc.length]+Math.floor(i/7)*12); cur.melody=melody; document.getElementById('melStat').textContent=`${melody.length} notes • ${curGenre} Code 1`; saveCur(); initMixer(); initAudio(); if(melody[0]) playChannel('Melodic Plucks\nINSTRUMENTS BUS\nDetuned Code 1',melody[0]);};
async function toggleHum(){const btn=document.getElementById('humBtn'); if(humRec&&humRec.state==='recording'){humRec.stop(); humStream.getTracks().forEach(t=>t.stop()); btn.textContent='●'; return;} try{initAudio(); humStream=await navigator.mediaDevices.getUserMedia({audio:true}); const src=aCtx.createMediaStreamSource(humStream); humAna=aCtx.createAnalyser(); humAna.fftSize=2048; src.connect(humAna); humPitches=[]; humRec=new MediaRecorder(humStream); humRec.start(); btn.textContent='■'; (function loop(){if(!humAna) return; const buf=new Float32Array(humAna.fftSize); humAna.getFloatTimeDomainData(buf); const p=autoCorr(buf,aCtx.sampleRate); if(p>60&&p<1000){humPitches.push(p); drawHum(buf);} requestAnimationFrame(loop);})(); setTimeout(()=>{if(humRec&&humRec.state==='recording'){humRec.stop(); humStream.getTracks().forEach(t=>t.stop()); btn.textContent='●'; analyzeHum();}},8000);}catch{toast('Mic needed');}}
function autoCorr(buf,sr){let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length); if(rms<.01) return -1; let c=new Array(buf.length).fill(0); for(let i=0;i<buf.length;i++) for(let j=0;j<buf.length-i;j++) c[i]+=buf[j]*buf[j+i]; let d=0; while(c[d]>c[d+1]) d++; let max=-1,pos=-1; for(let i=d;i<buf.length;i++) if(c[i]>max){max=c[i];pos=i;} return sr/pos;}
function noteFromFreq(f){const n=Math.round(12*Math.log2(f/440))+69; return {midi:n,pc:NOTES[n%12]}}
function drawHum(buf){const c=document.getElementById('humWave'),x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height); x.strokeStyle='#6366F1'; x.beginPath(); for(let i=0;i<c.width;i++){const idx=Math.floor(i/c.width*buf.length); const y=(buf[idx]*.5+.5)*c.height; i===0?x.moveTo(i,y):x.lineTo(i,y);} x.stroke();}
function analyzeHum(){if(humPitches.length<12){toast('Too short'); return;} const notes=humPitches.map(noteFromFreq); const pc={}; notes.forEach(n=>pc[n.pc]=(pc[n.pc]||0)+1); const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]); humKey=sorted[0][0]||'C'; let iv=[]; for(let i=1;i<humPitches.length;i++) if(Math.abs(humPitches[i]-humPitches[i-1])>8) iv.push(i); const avg=iv.length>2?(iv[iv.length-1]-iv[0])/iv.length:20; humBpm=Math.round(60000/(avg*18))||84; if(humBpm<75) humBpm=72; else if(humBpm<90) humBpm=84; else if(humBpm<105) humBpm=96; else if(humBpm<120) humBpm=112; else humBpm=128; humGenre=humBpm<=84?'Lugaflow':humBpm<=100?'Afrobeats':humBpm<=115?'Amapiano':'Gqom'; document.getElementById('humRes').textContent=`Detected Key ${humKey} • ~${humBpm} BPM • Auto Genre ${humGenre} FROM CODE 1`; document.getElementById('genFromHum').style.display='block';}
document.getElementById('humBtn').onclick=toggleHum;
document.getElementById('genFromHum').onclick=()=>{document.getElementById('keySel').value=humKey; cur.key=humKey; cur.bpm=humBpm; document.getElementById('bpm').value=humBpm; curBpm=humBpm; setGenre(humGenre); melody=humPitches.slice(0,16).map(f=>Math.round(12*Math.log2(f/440)+69)); cur.melody=melody; saveCur(); initMixer(); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='studio')); document.querySelectorAll('.view').forEach(v=>v.hidden=true); document.getElementById('studioView').hidden=false;};
document.getElementById('theme').onclick=()=>{const curT=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme',curT==='dark'?'light':'dark');};
document.getElementById('exportPdf').onclick=()=>{const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text(cur.title,14,20); doc.save(cur.title+'.pdf');};
buildGenres(); renderList(); renderPiano(); renderChords(); initMixer(); upd();
</script>
</body>
