<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Premium Studio Mixer & Multi-Engine DAW</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --strip-color: #262626;
            --accent-blue: #00adb5;
            --fader-cap: #e1e1e1;
            --accent-green: #5cb85c;
        }

        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Engine Panel Layout Containers */
        .studio-panel {
            background: #222;
            border: 2px solid #444;
            padding: 20px;
            border-radius: 8px;
            width: 540px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .engine-title {
            margin-top: 0;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .genre-select {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }

        .action-btn {
            padding: 12px 28px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s ease;
            width: 80%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-red { background: #d9534f; }
        .btn-blue { background: var(--accent-blue); }

        .lyrics-textarea {
            width: 100%;
            height: 65px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
        }

        .status-box { margin-top: 12px; font-size: 13px; color: #aaa; }
        .display-box { margin-top: 8px; font-size: 15px; font-weight: bold; color: #fff; }
        .result-box { margin-top: 5px; font-size: 18px; font-weight: bold; color: var(--accent-blue); }

        /* Mixer Console Chassis */
        .mixer-console {
            background-color: var(--bg-color);
            border: 4px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Vertical Channel Strip Layouts */
        .channel-strip {
            background-color: var(--strip-color);
            width: 95px;
            margin: 0 6px;
            padding: 15px 5px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid #3a3a3a;
            border-right: 1px solid #141414;
        }

        .channel-name {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #aaa;
            background: #111;
            padding: 3px 8px;
            border-radius: 3px;
            width: 70px;
            text-align: center;
        }

        /* Rotary Pan Knob Styling */
        .pan-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: #888;
            margin-bottom: 20px;
        }

        .pan-slider {
            width: 65px;
            margin-top: 5px;
        }

        /* Vertical Fader Mechanical Groove Track Rail */
        .fader-container {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }

        .fader-slider {
            -webkit-appearance: none;
            appearance: none;
            transform: rotate(-90deg);
            width: 180px;
            height: 6px;
            background: #111;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        /* Custom Fader Caps */
        .fader-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 30px;
            background: var(--fader-cap);
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border-left: 2px solid #666;
            border-right: 2px solid #666;
        }

        /* Global Control Function Switch Buttons */
        .btn-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .mixer-btn {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
        }

        .mixer-btn.active-mute { background: #d9534f; }
        .mixer-btn.active-solo { background: #f0ad4e; }

        /* Master Output Section Override */
        .master-section {
            border-left: 3px double #555;
            margin-left: 15px;
            padding-left: 15px;
        }
        
        .master-section .channel-name {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <!-- ENGINE MODULE 1: Hum to Chord Engine -->
    <div class="studio-panel">
        <h3 class="engine-title">1. Vocal Hum to Chord Engine</h3>
        
        <select class="genre-select" id="genre-select">
            <optgroup label="African Harmonic Frameworks (7)">
                <option value="afrobeats">Afrobeats (Major Pentatonic Mode)</option>
                <option value="amapiano">Amapiano (Jazz Log-Drum Minor 7ths)</option>
                <option value="highlife">Highlife (Diatonic Arpeggio Progressions)</option>
                <option value="bongoflava">Bongo Flava (Smooth Afro R&B Inversions)</option>
                <option value="gengetone">Gengetone (Street Rhythm Bass Clusters)</option>
                <option value="coupedecale">Coupé-Décalé (Fast-Paced Polyphonic Tones)</option>
                <option value="kwaito">Kwaito (Slow-Tempo Deep House Inversions)</option>
            </optgroup>
            <optgroup label="Western Harmonic Frameworks (7)">
                <option value="pop">Pop (Classic Diatonic Anthems)</option>
                <option value="hiphop">Hip-Hop (Trap/Boom-Bap Minor Sequences)</option>
                <option value="synthwave">Synthwave (Vintage Retro 80s Intervals)</option>
                <option value="rnb">R&B (Smooth Chromatic Major/Minor 9ths)</option>
                <option value="rock">Rock (Heavy Root Power-Chords)</option>
                <option value="house">House (Classic 4x4 Club Triad Sequences)</option>
                <option value="jazz">Jazz (Complex Extended Modal Alterations)</option>
            </optgroup>
        </select>

        <button id="record-btn" class="action-btn btn-red">🎤 Start Audio Engine & Hum</button>
        <div class="status-box" id="status-display">Status: Offline (Click button to initialize Audio Context)</div>
        <div class="display-box" id="output-display">Detected Melody: --</div>
        <div class="result-box" id="chord-display">Generated Harmony: --</div>
    </div>

    <!-- ENGINE MODULE 2: Lyrics to Melody Engine -->
    <div class="studio-panel">
        <h3 class="engine-title">2. Lyrics-To-Melody Composer</h3>
        <textarea id="lyric-text" class="lyrics-textarea" placeholder="Type or paste your lyrics text stanza line here... (e.g., 'Moving my feet on the studio floor')"></textarea>
        <button id="lyric-btn" class="action-btn btn-blue">⚡ Compose & Play Lyric Melody</button>
        <div class="status-box" id="lyric-status-display">Status: Awaiting Text Input</div>
    </div>

    <!-- 5-Channel Premium Studio Console Mixer Layout Frame -->
    <div class="mixer-console">
        
        <!-- Track 1: Drums -->
        <div class="channel-strip" id="ch-drums">
            <div class="channel-name">Drums</div>
            <div class="pan-container">PAN<input type="range" class="pan-slider" min="-1" max="1" step="0.1" value="0"></div>
            <div class="fader-container"><input type="range" class="fader-slider" min="0" max="1" step="0.01" value="0.6"></div>
            <div class="btn-group">
                <button class="mixer-btn mute-btn">M</button>
                <button class="mixer-btn solo-btn">S</button>
            </div>
        </div>

        <!-- Track 2: Bass -->
        <div class="channel-strip" id="ch-bass">
            <div class="channel-name">Bass</div>
            <div class="pan-container">PAN<input type="range" class="pan-slider" min="-1" max="1" step="0.1" value="-0.2"></div>
            <div class="fader-container"><input type="range" class="fader-slider" min="0" max="1" step="0.01" value="0.6"></div>
            <div class="btn-group">
                <button class="mixer-btn mute-btn">M</button>
