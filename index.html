<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Tapehead — Premium Sound</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0A0A0C;--panel:#16161A;--panel2:#1C1C20;--line:#232326;--text:#F8FAFC;--dim:#94A3B8;--indigo:#6366F1;--indigo2:#4F46E5;--cyan:#06B6D4;--radius:18px;--font-d:'Fraunces',serif;--font-b:'Inter',sans-serif;--font-m:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(22,22,26,.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header b{font-family:var(--font-d);font-size:18px}
.view{flex:1;padding:12px 10px 92px;overflow:auto}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card-h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#1E1E24,#121214);border-bottom:1px solid var(--line)}
.card-h h2{font-family:var(--font-d);font-size:14px;font-weight:700}.card-b{padding:12px}
.lyrics{width:100%;min-height:260px;background:#0A0A0C;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font-size:14px;line-height:1.7;outline:none;resize:none}
.input{width:100%;background:#0A0A0C;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#121214;color:var(--text);font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn:active{transform:scale(.96)}.btn.pri{background:linear-gradient(180deg,var(--indigo),var(--indigo2));border:none;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.35)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#121214;color:var(--dim);font-family:var(--font-m);font-size:10px;cursor:pointer;display:inline-flex;align-items:center}.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.piano{height:72px;display:flex;gap:2px;background:#0E0E10;border:1px solid var(--line);border-radius:12px;padding:8px;position:relative}.pkey{flex:1;background:linear-gradient(180deg,#242428,#1A1A1E);border:1px solid var(--line);border-radius:0 0 9px 9px;display:flex;align-items:end;justify-content:center;padding-bottom:6px;font-size:11px}.pkey.on{background:var(--indigo);color:#fff}.bkey{position:absolute;top:8px;width:26px;height:44px;background:#0A0A0C;border-radius:0 0 6px 6px;z-index:2}
/* MIXER - NO DESCRIPTIONS */
.mixer{background:rgba(18,18,20,.98);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mix-top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(120% at 0% 0%, rgba(99,102,241,.18), transparent), linear-gradient(180deg,#1E1E24,#121214);border-bottom:1px solid var(--line)}
.transport{display:flex;gap:10px;align-items:center;padding:12px;background:#0E0E10;border-bottom:1px solid var(--line)}
.play{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,var(--indigo),var(--indigo2));color:#fff;border:none;font-weight:900;font-size:20px;box-shadow:0 10px 24px rgba(99,102,241,.45);display:grid;place-items:center;cursor:pointer}
.genre-row{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#0A0A0C;border-bottom:1px solid var(--line)}.genre-row::-webkit-scrollbar{display:none}
.track{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:10px 12px;border-top:1px solid #1E1E20;align-items:center}
.t-name{font-family:var(--font-d);font-size:11px;font-weight:700;line-height:1.1}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.st{height:30px;border-radius:8px;background:#18181B;border:1px solid #232326;cursor:pointer;transition:.12s}.st.on{background:linear-gradient(180deg,var(--indigo),var(--indigo2));box-shadow:0 4px 12px rgba(99,102,241,.4);border-color:var(--indigo)}.st:active{transform:scale(.92)}
.fader{width:52px;height:4px;accent-color:var(--indigo)}.meter{width:36px;height:4px;background:#0A0A0C;border-radius:999px;overflow:hidden}.meter-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--cyan));width:35%}
.wave{width:100%;height:48px;background:#0A0A0C;border:1px solid var(--line);border-radius:10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:82px;background:rgba(16,16,20,.92);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.btab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-family:var(--font-m);font-size:9px;border:none;background:none;cursor:pointer}.btab i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:#121214;border:1px solid var(--line);font-style:normal;font-size:14px}.btab.on{color:var(--text)}.btab.on i{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#F8FAFC;color:#000;padding:10px 16px;border-radius:999px;font-family:var(--font-m);font-size:10px;opacity:0;transition:.35s;z-index:99}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.hidden-desc{display:none!important}
</style>
</head>
<body>
<div class="app">
<div class="header"><b>Tapehead</b><div style="display:flex;gap:6px"><span id="genrePill" style="font-family:var(--font-m);font-size:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#0E0E10">AFROBEATS</span></div></div>

<div id="writeView" class="view">
<div class="card"><div class="card-h"><h2>Lyrics</h2></div><div class="card-b">
<input id="title" class="input" placeholder="Song title" style="margin-bottom:10px;font-family:var(--font-d);font-weight:700">
<textarea id="lyrics" class="lyrics" placeholder="Write..."></textarea>
<div id="writeChips" class="chips" style="margin-top:10px"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="genMelody" style="flex:1">Generate</button><button class="btn" id="exportPdf">⎙</button></div>
</div></div>

<div class="card"><div class="card-b">
<div style="display:flex;gap:12px;align-items:center"><button class="play" id="humBtn">●</button><div><div style="font-family:var(--font-d);font-weight:700">Hum</div></div><input id="writer" value="Writer 01" class="input" style="width:90px;height:32px;font-size:11px"></div>
<canvas id="humWave" class="wave" width="360" height="48" style="margin-top:10px"></canvas>
<div id="humRes" class="hidden-desc"></div>
<button id="genFromHum" class="btn pri" style="width:100%;margin-top:10px;display:none">GENERATE BEAT →</button>
</div></div>

<div class="card"><div class="card-h"><h2>Songs</h2></div><div class="card-b"><input id="search" class="input" placeholder="Search..."><div id="songList" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto"></div><button class="btn" id="newBtn" style="width:100%;margin-top:10px">+ New</button></div></div>
</div>

<div id="studioView" class="view" hidden>
<div class="card"><div class="card-h"><h2>Chords</h2></div><div class="card-b"><div id="piano" class="piano"></div><div id="chordList" class="chips" style="margin-top:10px"></div></div></div>

<div class="card mixer">
<div class="mix-top"><b id="kitName" style="font-family:var(--font-d);font-size:13px">Afrobeats</b><span id="kitDesc" class="hidden-desc"></span></div>
<div class="transport"><button class="play" id="playBtn">▶</button><div><div id="bpmLabel" style="font-family:var(--font-d);font-weight:800">96 BPM</div></div><div style="margin-left:auto;display:flex;gap:8px"><input id="revSend" type="range" min="0" max="100" value="22" class="fader"><input id="masterFilt" type="range" min="0" max="100" value="100" class="fader"></div></div>
<div class="genre-row" id="afroRow"></div>
<div class="genre-row" id="westRow"></div>
<div style="padding:8px 12px;background:#0A0A0C;border-top:1px solid var(--line);display:flex;gap:8px"><select id="keySel" class="input" style="height:32px;width:72px"></select><input id="bpm" type="number" value="96" class="input" style="height:32px;width:64px"></div>
<div id="tracks"></div>
<div style="display:grid;grid-template-columns:76px 1fr;height:44px;background:#121214;border-top:2px solid var(--indigo)"><div style="padding:8px"><div class="meter" style="width:60px;margin-top:6px"><div id="masterMeter" class="meter-fill"></div></div></div><canvas id="masterWave" width="300" height="30" style="width:100%;height:30px"></canvas></div>
<canvas id="wave" width="400" height="34" style="width:100%;height:34px;background:#0A0A0C"></canvas>
</div>
</div>

<div id="publishView" class="view" hidden>
<div class="card"><div class="card-b">
<canvas id="pubWave" class="wave" style="height:84px"></canvas>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn pri" id="renderDemo" style="grid-column:1/3;height:48px">Render Demo</button><button class="btn" id="dlDemo" disabled>Download</button><button class="btn" id="waShare" style="background:#25D366;color:#000;font-weight:700">WhatsApp</button></div>
<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="copyAll" style="flex:1">Copy</button><button class="btn" id="pdfPub" style="flex:1">PDF</button></div>
</div></div>
</div>

<div class="bottom">
<button class="btab on" data-tab="write"><i>✎</i>Write</button>
<button class="btab" data-tab="studio"><i>◍</i>Studio</button>
<button class="btab" data-tab="publish"><i>⤴</i>Publish</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DIATONIC=[{rn:'I',n:'C'},{rn:'ii',n:'Dm'},{rn:'iii',n:'Em'},{rn:'IV',n:'F'},{rn:'V',n:'G'},{rn:'vi',n:'Am'},{rn:'vii°',n:'Bdim'}];
const KITS={
'Afrobeats':{bpm:96,region:'african',tracks:['Kick','Snare','Log Drum','Hats','Bass','Plucks','Vocal','FX'],sound:{kick:'afro',snare:'crisp',log:'fm'}},
'Lugaflow':{bpm:84,region:'african',tracks:['Kick','Snare','Hats','Bass','Guitars','Back Vox','Lead','FX'],sound:{kick:'warm',snare:'rim',log:'soft'}},
'Amapiano':{bpm:112,region:'african',tracks:['Kick','Log Bass','Shaker','Bass','Pad','Choir'],sound:{kick:'deep',snare:'log',log:'deep'}},
'Bongo Flava':{bpm:98,region:'african',tracks:['Kick','Rim','Bongo','Bass','Guitar','Keys'],sound:{kick:'bongo',snare:'rim',log:'bongo'}},
'Gqom':{bpm:128,region:'african',tracks:['Kick','Log Hard','Clap','Bass','Pad','FX'],sound:{kick:'hard',snare:'hard',log:'dist'}},
'Highlife':{bpm:100,region:'african',tracks:['Kick','Snare','Conga','Bass','Guitar','Horns'],sound:{kick:'bright',snare:'snappy',log:'conga'}},
'Pop':{bpm:100,region:'western',tracks:['Kick','Snare','Hats','Bass','Supersaw','Vocal'],sound:{kick:'pop',snare:'pop',log:'pop'}},
'Hip-Hop':{bpm:88,region:'western',tracks:['Kick','Snare','Hats','Bass','Rhodes','Chop'],sound:{kick:'vinyl',snare:'vinyl',log:'rhodes'}},
'Trap':{bpm:140,region:'western',tracks:['Kick','Snare','Hats','808 Slide','Bell','Vocal'],sound:{kick:'trap',snare:'trap',log:'808'}},
'R&B':{bpm:72,region:'western',tracks:['Kick','Snare','Shaker','Bass','Guitar','Rhodes'],sound:{kick:'soft',snare:'brush',log:'rhodes'}},
'House':{bpm:124,region:'western',tracks:['Kick','Clap','Hats','Bass','Stab','Pad'],sound:{kick:'house',snare:'house',log:'stab'}},
'EDM':{bpm:128,region:'western',tracks:['Kick','Snare','Hats','Bass','Supersaw','FX'],sound:{kick:'big',snare:'anthem',log:'saw'}},
};
let curGenre='Afrobeats',curKit=KITS[curGenre],curBpm=96,activeIdx=0,writerSeed=1,melody=[],pattern={},vol={},mute={},solo={},isPlaying=false,timer=null,stepPos=0,aCtx,master,comp,revNode,delayNode,masterFilt,satNode,noiseBuf,demoBlob=null;
let humStream=null,humRec=null,humAna=null,humPitches=[],humKey='C',humBpm=96,humGenre='Afrobeats';
let songs=JSON.parse(localStorage.getItem('tapehead_prem_hide_v1')||'[]'); let activeId=songs[0]?.id||null;
function uid(){return Math.random().toString(36).slice(2,9)} function save(){localStorage.setItem('tapehead_prem_hide_v1',JSON.stringify(songs))}
if(!songs.length){songs=[{id:uid(),title:'Untitled song',lyrics:'',key:'C',bpm:96,melody:[]}]; activeId=songs[0].id; save()}
let cur=songs.find(s=>s.id===activeId)||songs[0];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i); h|=0} return Math.abs(h)||1}
function seeded(seed){let s=seed%2147483647; return()=>{s=(s*16807)%2147483647; return (s-1)/2147483646}}
function haptic(ms=12){if('vibrate' in navigator) navigator.vibrate(ms)}
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000)}
function initAudio(){ if(aCtx) return; aCtx=new (window.AudioContext||window.webkitAudioContext)(); noiseBuf=aCtx.createBuffer(1,aCtx.sampleRate,aCtx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; master=aCtx.createGain(); master.gain.value=.88; comp=aCtx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=.003; comp.release.value=.22; satNode=aCtx.createWaveShaper(); satNode.curve=makeDist(2.2); satNode.oversample='4x'; masterFilt=aCtx.createBiquadFilter(); masterFilt.type='lowpass'; masterFilt.frequency.value=20000; revNode=aCtx.createConvolver(); const len=aCtx.sampleRate*2.8; const imp=aCtx.createBuffer(2,len,aCtx.sampleRate); for(let ch=0;ch<2;ch++){ const dat=imp.getChannelData(ch); for(let i=0;i<len;i++) dat[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*.55; } revNode.buffer=imp; const revGain=aCtx.createGain(); revGain.gain.value=.22; const revFilt=aCtx.createBiquadFilter(); revFilt.frequency.value=4200; revFilt.Q.value=.8; revNode.connect(revFilt); revFilt.connect(revGain); revGain.connect(comp); delayNode=aCtx.createDelay(1); delayNode.delayTime.value=.34; const dGain=aCtx.createGain(); dGain.gain.value=.16; const dFilt=aCtx.createBiquadFilter(); dFilt.type='lowpass'; dFilt.frequency.value=2800; delayNode.connect(dFilt); dFilt.connect(dGain); dGain.connect(comp); master.connect(satNode); satNode.connect(masterFilt); masterFilt.connect(comp); comp.connect(aCtx.destination); document.getElementById('revSend').oninput=e=>{revGain.gain.value=e.target.value/100}; document.getElementById('masterFilt').oninput=e=>{masterFilt.frequency.value=200+ (e.target.value/100)*18000}; }
function makeDist(k){ const n=44100, curve=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*2/n-1; curve[i]=(3+k)*x*20*Math.PI/180 / (Math.PI + k*Math.abs(x)); } return curve; }
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
// PREMIUM SOUND ENGINE
function playChannel(trackName,tunedMidi){
 const t=aCtx.currentTime; const name=trackName; const v=vol[trackName]||.72; if(mute[trackName]) return; if(Object.values(solo).some(Boolean)&&!solo[trackName]) return; const dest=master; const sound=curKit.sound||{}; const rootMidi=tunedMidi||60+NOTES.indexOf(cur.key);
 if(name.includes('Kick')){
  const sub=aCtx.createOscillator(),click=aCtx.createOscillator(),g=aCtx.createGain(),cg=aCtx.createGain();
  let sF=130,eF=38,dec=.52,clickF=2800; if(sound.kick==='warm'){sF=100;eF=42;dec=.62} if(sound.kick==='deep'){sF=88;eF=30;dec=.74;clickF=1200} if(sound.kick==='hard'){sF=170;eF=28;dec=.44;clickF=4200} if(sound.kick==='bright'){sF=135;eF=52;dec=.4;clickF=3500} if(sound.kick==='trap'){sF=155;eF=32;dec=.42;clickF=3800} if(sound.kick==='house'){sF=128;eF=35;dec=.52} if(sound.kick==='bongo'){sF=115;eF=45;dec=.42}
  sub.frequency.setValueAtTime(sF,t); sub.frequency.exponentialRampToValueAtTime(eF,t+dec); g.gain.setValueAtTime(v*1.1,t); g.gain.exponentialRampToValueAtTime(.001,t+dec+.15);
  click.frequency.value=clickF; cg.gain.setValueAtTime(v*.18,t); cg.gain.exponentialRampToValueAtTime(.001,t+.04);
  sub.connect(g); click.connect(cg); g.connect(dest); cg.connect(dest); sub.start(t); click.start(t); sub.stop(t+dec+.2); click.stop(t+.06); return;
 }
 if(name.includes('Snare')||name.includes('Clap')||name.includes('Rim')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),g=aCtx.createGain(),tone=aCtx.createOscillator(),tg=aCtx.createGain();
  f.type=sound.snare==='rim'?'bandpass':'highpass'; f.frequency.value=sound.snare==='brush'?1300:sound.snare==='rim'?2200:1900; f.Q.value=.8;
  tone.frequency.value=sound.snare==='rim'?1800:240; tg.gain.setValueAtTime(v*.25,t); tg.gain.exponentialRampToValueAtTime(.001,t+.12);
  g.gain.setValueAtTime(v*(sound.snare==='brush'?.32:.62),t); g.gain.exponentialRampToValueAtTime(.001,t+(sound.snare==='brush'?.38:.22));
  b.connect(f); f.connect(g); tone.connect(tg); g.connect(dest); tg.connect(dest); b.start(t); tone.start(t); b.stop(t+.28); tone.stop(t+.15); return;
 }
 if(name.includes('Log')||name.includes('Bongo')||name.includes('Conga')){
  const baseMidi=rootMidi-12 + (sound.log==='deep'?-3:0); const o=aCtx.createOscillator(),o2=aCtx.createOscillator(),g=aCtx.createGain(),filt=aCtx.createBiquadFilter();
  o.type='sine'; o2.type='triangle'; o.frequency.setValueAtTime(midiFreq(baseMidi),t); o2.frequency.setValueAtTime(midiFreq(baseMidi)*1.007,t);
  const fm=aCtx.createOscillator(),fg=aCtx.createGain(); fm.frequency.value=midiFreq(baseMidi)* (sound.log==='fm'?1.51:sound.log==='dist'?2.3:1.25); fg.gain.value=sound.log==='fm'?260:sound.log==='dist'?380:140; fm.connect(fg); fg.connect(o.frequency);
  filt.type='lowpass'; filt.frequency.value=sound.log==='dist'?1100:sound.log==='deep'?680:950; filt.Q.value=.6;
  const sat=aCtx.createWaveShaper(); sat.curve=makeDist(1.8); sat.oversample='2x';
  g.gain.setValueAtTime(v*.88,t); g.gain.exponentialRampToValueAtTime(.001,t+.72);
  o.connect(filt); o2.connect(filt); filt.connect(sat); sat.connect(g); g.connect(dest); g.connect(revNode);
  fm.start(t); o.start(t); o2.start(t); fm.stop(t+.32); o.stop(t+.76); o2.stop(t+.76); return;
 }
 if(name.includes('Hats')||name.includes('Shaker')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),hp=aCtx.createBiquadFilter(),g=aCtx.createGain(); f.type='highpass'; f.frequency.value=7200; hp.type='highpass'; hp.frequency.value=11000; g.gain.setValueAtTime(v*.26,t); g.gain.exponentialRampToValueAtTime(.001,t+.09); b.connect(f); f.connect(hp); hp.connect(g); g.connect(dest); b.start(t); b.stop(t+.11); return;
 }
 if(name.includes('Bass')||name.includes('808')){
  const baseMidi=36+NOTES.indexOf(cur.key)+(melody[0]%5||0); const o=aCtx.createOscillator(),o2=aCtx.createOscillator(),g=aCtx.createGain(),f=aCtx.createBiquadFilter();
  o.type='sine'; o2.type='sine'; o.frequency.setValueAtTime(midiFreq(baseMidi),t); o.frequency.linearRampToValueAtTime(midiFreq(baseMidi+ (Math.random()>.6?2:0)),t+.18); o2.frequency.value=midiFreq(baseMidi)*1.5; f.type='lowpass'; f.frequency.value=180; g.gain.setValueAtTime(v*.95,t); g.gain.exponentialRampToValueAtTime(.001,t+1.1); o.connect(f); o2.connect(f); f.connect(g); g.connect(dest); o.start(t); o2.start(t); o.stop(t+1.15); o2.stop(t+1.15); return;
 }
 if(name.includes('Plucks')||name.includes('Guitar')||name.includes('Supersaw')||name.includes('Pad')||name.includes('Stab')||name.includes('Rhodes')||name.includes('Horns')||name.includes('Keys')){

function genUniquePattern(seed,genre,melNotes){

  const n=t; let p=new Array(16).fill(0);
  if(n.includes('Kick')){ p[0]=1; p[8]=1; if(r()>.55) p[10]=1; if(genre==='House'){p=new Array(16).fill(0); p[0]=1; p[4]=1; p[8]=1; p[12]=1;} if(genre==='Trap'&&r()>.6) p[11]=1; }
  else if(n.includes('Snare')||n.includes('Clap')||n.includes('Rim')){ p[4]=1; p[12]=1; }
  else if(n.includes('Log')||n.includes('Bongo')||n.includes('Conga')){ const intervals=melNotes?.length? melNotes.slice(0,4).map(m=>(m-rootMidi+12)%12) : [0,3,7,10]; const steps=[0,3,6,10,14]; steps.forEach(st=>{ if(r()>.28) p[st]=1; }); p.tuning=intervals; }

  else if(n.includes('Bass')||n.includes('808')){ p[0]=1; p[8]=1; p.root=rootMidi-24+melHash%5; }
  else if(n.includes('Plucks')||n.includes('Guitar')||n.includes('Supersaw')||n.includes('Pad')){ for(let i=0;i<16;i+=4) if(r()>.45) p[i]=1; }
  pat[t]=p; vol[t]=n.includes('Kick')?.92:n.includes('Log')?.86:n.includes('Bass')?.88:.66; mute[t]=false; solo[t]=false;
 }); return pat;
}
