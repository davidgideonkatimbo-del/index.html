<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tapehead — African Premium • Polished</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F0E9D9;--panel:#FBF8F0;--panel2:#E9E0C9;--line:#D8CBA6;--text:#2B2415;--dim:#7C7156;--indigo:#6366F1;--cyan:#06B6D4;--font-d:'Fraunces',serif;--font-b:'Inter',sans-serif;--font-m:'JetBrains Mono',monospace}
:root[data-theme="dark"]{--bg:#0A0A0C;--panel:#16161A;--panel2:#1C1C20;--line:#232326;--text:#F8FAFC;--dim:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font-b)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--panel2);padding:16px;display:flex;flex-direction:column;gap:12px}
.top{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}.tab{padding:7px 12px;border-radius:7px;border:none;background:none;color:var(--dim);cursor:pointer}.tab.on{background:var(--indigo);color:#fff;font-weight:600}
.view{padding:18px 20px 80px} [hidden]{display:none!important}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-b{padding:12px 14px}
.lyrics{width:100%;min-height:300px;border:none;background:none;resize:vertical;font-size:15px;line-height:1.7;outline:none}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}.btn.pri{background:var(--indigo);color:#fff;border-color:var(--indigo);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-m);font-size:10px;cursor:pointer}.chip.on{background:var(--indigo);color:#fff}
.piano{position:relative;height:84px;display:flex;margin:10px 0}.pkey{flex:1;border:1px solid var(--line);border-left:none;background:var(--panel);border-radius:0 0 8px 8px;display:flex;align-items:end;justify-content:center;padding-bottom:6px;font-size:11px;cursor:pointer}.pkey.on{background:var(--indigo);color:#fff}.bkey{position:absolute;top:0;width:28px;height:52px;background:#0A0A0C;border-radius:0 0 6px 6px;z-index:2}
.mixer{background:rgba(14,14,16,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mix-head{padding:10px 12px;background:linear-gradient(180deg,#1C1C20,#121214);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);color:#F8FAFC}
.transport{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#121214;border-bottom:1px solid var(--line);color:#F8FAFC}
.play{width:44px;height:44px;border-radius:50%;background:var(--indigo);color:#fff;border:none;font-weight:900;cursor:pointer}
.genre-section{padding:10px;background:#0A0A0C;border-bottom:1px solid var(--line)}
.track{display:grid;grid-template-columns:92px 56px 1fr;gap:8px;padding:8px 10px;border-top:1px solid #1E1E20;align-items:center}
.t-meta{font-family:var(--font-m);font-size:7px;color:#94A3B8;text-align:center}.t-meta b{font-size:8px;color:#F8FAFC;display:block}.bus{font-size:6px;background:var(--cyan);color:#000;padding:2px 5px;border-radius:999px;font-weight:700;display:inline-block;margin-top:2px}.desc{font-size:6px;color:#94A3B8;margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}.st{height:24px;border-radius:6px;background:#18181B;border:1px solid #27272A;cursor:pointer}.st.on{background:var(--indigo)}.st.log.on{background:#7A9A7A}.st.bass.on{background:#C4623B}
.fader{width:60px;height:3px;accent-color:var(--indigo)}.meter{width:48px;height:4px;background:#0A0A0C;border-radius:999px;overflow:hidden}.meter-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--cyan));width:40%}
.wave{width:100%;height:64px;background:#0A0A0C;border:1px solid var(--line);border-radius:8px}
.select{width:100%;height:44px;background:#121214;color:#F8FAFC;border:1px solid #232326;border-radius:10px;padding:0 12px;font-family:var(--font-m);font-size:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#F8FAFC;color:#000;padding:10px 16px;border-radius:999px;font-family:var(--font-m);font-size:10px;opacity:0;transition:.3s;z-index:99}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div style="font-family:var(--font-d);font-weight:600">Tapehead <span style="font-family:var(--font-m);font-size:9px;color:var(--dim)">AFRICAN • POLISHED</span></div>
<button class="btn pri" id="newBtn" style="width:100%">+ New Song</button>
<input id="search" placeholder="Search..." style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)">
<div id="songList" style="display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto"></div>
<button id="theme" class="btn" style="width:100%">◐ Theme</button>
</aside>
<main>
<header class="top">
<input id="title" placeholder="Untitled" style="flex:1;background:none;border:none;font-family:var(--font-d);font-size:20px">
<div style="display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px">
<span style="font-family:var(--font-m);font-size:10px;color:var(--dim)">KEY</span><select id="keySel"></select>
<span style="font-family:var(--font-m);font-size:10px;color:var(--dim)">BPM</span><input id="bpm" type="number" value="96" style="width:54px">
<span style="font-family:var(--font-m);font-size:10px;color:var(--dim)">WRITER</span><input id="writer" value="Writer 01" style="width:80px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel)">
</div>
<div class="tabs"><button class="tab on" data-tab="write">Write</button><button class="tab" data-tab="studio">Studio</button><button class="tab" data-tab="publish">Publish</button></div>
<button class="btn" id="exportPdf">Export PDF</button>
</header>

<section class="view" id="writeView">
<div class="card"><div class="card-h"><h2>Lyrics</h2><span id="save" style="font-family:var(--font-m);font-size:10px;color:var(--dim)">—</span></div>
<div class="card-b"><textarea id="lyrics" class="lyrics" placeholder="Verse..."></textarea><div id="writeChips" class="chips" style="margin-top:8px"></div><button class="btn pri" id="genMelody" style="margin-top:10px">Generate melody + unique beat</button><span id="melStat" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-left:8px"></span></div></div>
<div class="card"><div class="card-b"><div style="display:flex;gap:10px;align-items:center"><button class="play" id="humBtn">●</button><b>Hum</b></div><canvas id="humWave" class="wave" width="400" height="64" style="margin-top:10px"></canvas><div id="humRes" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px">No hum yet</div><button id="genFromHum" class="btn pri" style="width:100%;margin-top:8px;display:none">GENERATE FOR MY HUM →</button></div></div>
</section>

<section class="view" id="studioView" hidden>
<div class="card"><div class="card-b"><div id="piano" class="piano"></div><div id="chordList" class="chips" style="margin-top:10px"></div><div id="progInfo" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px"></div></div></div>

<div class="card mixer">
<div class="mix-head"><b id="kitName">Afrobeats • Polished</b><span id="kitDesc" style="font-family:var(--font-m);font-size:7px;background:#0A0A0C;padding:5px 8px;border-radius:999px;border:1px solid var(--line)">POLISHED • NO CRACKLE • AFRICAN ONLY</span></div>
<div class="transport"><button class="play" id="playBtn">▶</button><div id="bpmLabel" style="font-weight:700">96 BPM</div><div id="instLabel" style="font-family:var(--font-m);font-size:7px;color:#94A3B8">MASTER • POLISHED • LIMITER -3dB • REVERB 2.2s • NO CLIP</div><div style="margin-left:auto;display:flex;gap:8px"><input id="revSend" type="range" min="0" max="100" value="18" class="fader"><input id="masterFilt" type="range" min="0" max="100" value="100" class="fader"></div></div>

<div class="genre-section">
<label style="font-family:var(--font-m);font-size:8px;color:#94A3B8;letter-spacing:1px">SELECT GENRE • AFRICAN 6 • DROPDOWN • POLISHED SOUND</label>
<select id="genreSel" class="select" style="margin-top:6px">
<option value="Afrobeats">Afrobeats — 96 BPM • Log Drum FM • Premium</option>
<option value="Lugaflow">Lugaflow — 84 BPM • Ugandan Warm • Adungu</option>
<option value="Amapiano">Amapiano — 112 BPM • Deep Log • Pad</option>
<option value="Bongo Flava">Bongo Flava — 98 BPM • Tanzanian Bounce • Guitar</option>
<option value="Gqom">Gqom — 128 BPM • Durban Hard • Dist Log</option>
<option value="Highlife">Highlife — 100 BPM • Ghana Bright • Horns</option>
</select>
</div>

<div id="tracks"></div>
<canvas id="wave" width="400" height="34" style="width:100%;height:34px;background:#0A0A0C"></canvas>
</div>
</section>

<section class="view" id="publishView" hidden>
<div class="card" style="max-width:560px;margin:0 auto"><div class="card-b"><canvas id="pubWave" class="wave" style="height:90px"></canvas><div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="renderDemo">Render Demo</button><button class="btn" id="dlDemo" disabled>Download</button></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="waShare" style="background:#25D366;color:#000">WhatsApp</button><button class="btn" id="copyAll">Copy</button></div><div id="pubStat" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px"></div></div></div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DIATONIC=[{rn:'I',n:'C',notes:['C','E','G']},{rn:'ii',n:'Dm',notes:['D','F','A']},{rn:'iii',n:'Em',notes:['E','G','B']},{rn:'IV',n:'F',notes:['F','A','C']},{rn:'V',n:'G',notes:['G','B','D']},{rn:'vi',n:'Am',notes:['A','C','E']},{rn:'vii°',n:'Bdim',notes:['B','D','F']}];
// AFRICAN ONLY - FROM YOUR CODE 1, POLISHED
const KITS={
'Afrobeats':{bpm:96,region:'african',desc:'Log Drum FM • tuned to melody',tracks:['Kick\nDRUMS BUS\nPunchy Afro','Snare / Clap\nDRUMS BUS\nCrispy','Log Drum\nPERCUSSION BUS • premium FM tuned','Hi-hats / Shakers\nPERCUSSION BUS\nBounce','Bass 808\nBASS BUS\nFollows root','Melodic Plucks\nINSTRUMENTS BUS\nDetuned'],sound:{kick:'afro',snare:'crisp',log:'fm'}},
'Lugaflow':{bpm:84,region:'african',desc:'Ugandan warm • adungu',tracks:['Kick\nDRUMS BUS\nWarm','Snare / Rim\nDRUMS BUS\nRim','Hi-hats / Shakers\nPERCUSSION BUS\nSoft','Bass 808 Warm\nBASS BUS\nWarm','Guitars / Adungu\nINSTRUMENTS BUS\nClean','Lead Vocal\nVOCALS BUS\nIntimate'],sound:{kick:'warm',snare:'rim',log:'soft'}},
'Amapiano':{bpm:112,region:'african',desc:'Deep log • premium pad',tracks:['Deep Kick\nDRUMS BUS\nSub deep','Log Bass\nPERCUSSION BUS • premium deep','Shaker\nPERCUSSION BUS\nSilky','Bass Deep\nBASS BUS\nSlide','Pad\nINSTRUMENTS BUS\nWarm','Choir\nVOCALS BUS\nAiry'],sound:{kick:'deep',snare:'log',log:'deep'}},
'Bongo Flava':{bpm:98,region:'african',desc:'Tanzanian bounce',tracks:['Kick\nDRUMS BUS\nBongo','Rim\nDRUMS BUS\nTight','Bongo / Conga\nPERCUSSION BUS\nTuned','Bass\nBASS BUS\nRound','Guitar\nINSTRUMENTS BUS\nClean','Keys\nINSTRUMENTS BUS\nPlucks'],sound:{kick:'bongo',snare:'rim',log:'bongo'}},
'Gqom':{bpm:128,region:'african',desc:'Durban hard • distorted',tracks:['Gqom Kick\nDRUMS BUS\nHard','Log Drum Hard\nPERCUSSION BUS\nDark','Clap\nDRUMS BUS\nHard','Bass\nBASS BUS\nSlide','Dark Pad\nINSTRUMENTS BUS\nDark','FX\nFX BUS\nNoise'],sound:{kick:'hard',snare:'hard',log:'dist'}},
'Highlife':{bpm:100,region:'african',desc:'Ghana bright • horns',tracks:['Kick\nDRUMS BUS\nBright','Snare\nDRUMS BUS\nSnappy','Conga\nPERCUSSION BUS\nHighlife','Bass\nBASS BUS\nRound','Guitar\nINSTRUMENTS BUS\nBright','Horns\nINSTRUMENTS BUS\nPremium'],sound:{kick:'bright',snare:'snappy',log:'conga'}},
};
let curGenre='Afrobeats',curKit=KITS[curGenre],curBpm=96,activeIdx=0,melody=[],pattern={},vol={},mute={},solo={},isPlaying=false,timer=null,stepPos=0,aCtx,master,comp,revNode,delayNode,masterFilt,lowcut,noiseBuf;
let humStream=null,humRec=null,humAna=null,humPitches=[],humKey='C',humBpm=96,humGenre='Afrobeats';
let songs=JSON.parse(localStorage.getItem('tapehead_afro_polished')||'[]'); let activeId=songs[0]?.id||null;
function uid(){return Math.random().toString(36).slice(2,9)} function save(){localStorage.setItem('tapehead_afro_polished',JSON.stringify(songs))}
if(!songs.length){songs=[{id:uid(),title:'Untitled',lyrics:'',key:'C',bpm:96,melody:[]}]; activeId=songs[0].id; save()}
let cur=songs.find(s=>s.id===activeId)||songs[0];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i); h|=0} return Math.abs(h)||1}
function seeded(s){let x=s%2147483647; return()=>{x=(x*16807)%2147483647; return (x-1)/2147483646}}
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000)}
// POLISHED AUDIO - NO CRACKLE
function initAudio(){
 if(aCtx) return;
 aCtx=new (window.AudioContext||window.webkitAudioContext)();
 noiseBuf=aCtx.createBuffer(1,aCtx.sampleRate*0.5,aCtx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
 master=aCtx.createGain(); master.gain.value=0.68;
 comp=aCtx.createDynamicsCompressor(); comp.threshold.value=-12; comp.knee.value=20; comp.ratio.value=3; comp.attack.value=0.008; comp.release.value=0.22;
 lowcut=aCtx.createBiquadFilter(); lowcut.type='highpass'; lowcut.frequency.value=28;
 masterFilt=aCtx.createBiquadFilter(); masterFilt.type='lowpass'; masterFilt.frequency.value=19000;
 revNode=aCtx.createConvolver(); const len=aCtx.sampleRate*2.2; const imp=aCtx.createBuffer(2,len,aCtx.sampleRate); for(let ch=0;ch<2;ch++){const dat=imp.getChannelData(ch); for(let i=0;i<len;i++) dat[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)*0.35} revNode.buffer=imp;
 const rg=aCtx.createGain(); rg.gain.value=0.16; const rf=aCtx.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=3800; revNode.connect(rf); rf.connect(rg); rg.connect(comp);
 delayNode=aCtx.createDelay(1); delayNode.delayTime.value=0.32; const dg=aCtx.createGain(); dg.gain.value=0.12; delayNode.connect(dg); dg.connect(comp);
 master.connect(lowcut); lowcut.connect(masterFilt); masterFilt.connect(comp); comp.connect(aCtx.destination);
 document.getElementById('revSend').oninput=e=>rg.gain.value=e.target.value/100*0.28;
 document.getElementById('masterFilt').oninput=e=>masterFilt.frequency.value=400+(e.target.value/100)*18000;
}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
// POLISHED NON-CRACKY PLAY - ALL GAINS START AT 0 + 5ms RAMP
function playChannel(tn,tuned){
 if(!aCtx) return;
 const now=aCtx.currentTime+0.005;
 const v=Math.min(vol[tn]||0.62,0.72);
 if(mute[tn]) return; if(Object.values(solo).some(Boolean)&&!solo[tn]) return;
 const name=tn.split('\n')[0]; const s=curKit.sound;
 const outGain=aCtx.createGain(); outGain.gain.setValueAtTime(0,now); outGain.gain.linearRampToValueAtTime(v,now+0.005); outGain.connect(master);

 if(name.includes('Kick')){
  const sub=aCtx.createOscillator(); sub.type='sine';
  let sf=120,ef=42,dec=0.38; if(s.kick==='deep'){sf=86;ef=32;dec=0.55} if(s.kick==='hard'){sf=150;ef=36;dec=0.32} if(s.kick==='warm'){sf=98;ef=44;dec=0.48} if(s.kick==='bongo'){sf=108;ef=48;dec=0.34} if(s.kick==='bright'){sf=125;ef=50;dec=0.30}
  sub.frequency.setValueAtTime(sf,now); sub.frequency.exponentialRampToValueAtTime(ef,now+dec);
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.85,now+0.002); g.gain.exponentialRampToValueAtTime(0.001,now+dec+0.08);
  const click=aCtx.createOscillator(); click.type='triangle'; click.frequency.value=1600;
  const cg=aCtx.createGain(); cg.gain.setValueAtTime(0,now); cg.gain.linearRampToValueAtTime(0.09,now+0.001); cg.gain.exponentialRampToValueAtTime(0.001,now+0.05);
  sub.connect(g); g.connect(outGain); click.connect(cg); cg.connect(outGain);
  sub.start(now); click.start(now); sub.stop(now+dec+0.1); click.stop(now+0.06); return;
 }
 if(name.includes('Snare')||name.includes('Clap')||name.includes('Rim')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf;
  const f=aCtx.createBiquadFilter(); f.type=s.snare==='rim'?'bandpass':'highpass'; f.frequency.value=s.snare==='rim'?1700:1800; f.Q.value=0.7;
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.42,now+0.002); g.gain.exponentialRampToValueAtTime(0.001,now+0.18);
  b.connect(f); f.connect(g); g.connect(outGain);
  const tone=aCtx.createOscillator(); tone.type='sine'; tone.frequency.value=s.snare==='rim'?1800:220;
  const tg=aCtx.createGain(); tg.gain.setValueAtTime(0,now); tg.gain.linearRampToValueAtTime(0.18,now+0.001); tg.gain.exponentialRampToValueAtTime(0.001,now+0.10);
  tone.connect(tg); tg.connect(outGain);
  b.start(now); tone.start(now); b.stop(now+0.22); tone.stop(now+0.12); return;
 }
 if(name.includes('Log')||name.includes('Bongo')||name.includes('Conga')){
  const base=tuned||60;
  const o=aCtx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(midiFreq(base-12),now);
  const o2=aCtx.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(midiFreq(base-12)*1.003,now);
  const fm=aCtx.createOscillator(); const fg=aCtx.createGain();
  fm.frequency.setValueAtTime(midiFreq(base-12)*(s.log==='fm'?1.42:s.log==='dist'?1.8:1.18),now);
  fg.gain.setValueAtTime(0,now); fg.gain.linearRampToValueAtTime(s.log==='dist'?90:s.log==='fm'?110:55,now+0.002); fg.gain.exponentialRampToValueAtTime(0.001,now+0.18);
  fm.connect(fg); fg.connect(o.frequency);
  const filt=aCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=s.log==='deep'?620:s.log==='dist'?900:760; filt.Q.value=0.6;
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.68,now+0.004); g.gain.exponentialRampToValueAtTime(0.001,now+0.62);
  o.connect(filt); o2.connect(filt); filt.connect(g); g.connect(outGain); g.connect(revNode);
  fm.start(now); o.start(now); o2.start(now); fm.stop(now+0.20); o.stop(now+0.66); o2.stop(now+0.66); return;
 }
 if(name.includes('Hi-hat')||name.includes('Shaker')||name.includes('Hat')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf;
  const f=aCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6800;
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.18,now+0.001); g.gain.exponentialRampToValueAtTime(0.001,now+0.08);
  b.connect(f); f.connect(g); g.connect(outGain); b.start(now); b.stop(now+0.09); return;
 }
 if(name.includes('Bass')||name.includes('808')){
  const base=36+NOTES.indexOf(cur.key);
  const o=aCtx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(midiFreq(base),now);
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.72,now+0.008); g.gain.exponentialRampToValueAtTime(0.001,now+0.85);
  o.connect(g); g.connect(outGain); o.start(now); o.stop(now+0.90); return;
 }
 // Plucks / instruments - soft
 const d=DIATONIC[activeIdx];
 (d.notes||['C','E','G']).slice(0,2).forEach((nn,i)=>{
  const map={C:60,D:62,E:64,F:65,G:67,A:69,B:71}; const o=aCtx.createOscillator(); o.type='triangle';
  o.frequency.value=midiFreq((map[nn]||60)+12);
  const fi=aCtx.createBiquadFilter(); fi.type='lowpass'; fi.frequency.setValueAtTime(2800,now); fi.frequency.exponentialRampToValueAtTime(900,now+0.8);
  const g=aCtx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.10,now+0.01+i*0.02); g.gain.exponentialRampToValueAtTime(0.001,now+0.9);
  o.connect(fi); fi.connect(g); g.connect(outGain); g.connect(delayNode);
  o.start(now+i*0.02); o.stop(now+0.95);
 });
}

function genPattern(seed,genre,mel){const r=seeded(seed); const root=60+NOTES.indexOf(cur.key); const pat={}; curKit.tracks.forEach(t=>{let p=new Array(16).fill(0); const n=t.split('\n')[0]; if(n.includes('Kick')){p[0]=1;p[8]=1; if(r()>.6)p[10]=1} else if(n.includes('Snare')||n.includes('Clap')||n.includes('Rim')){p[4]=1;p[12]=1} else if(n.includes('Log')||n.includes('Bongo')||n.includes('Conga')){const iv=mel?.length?mel.slice(0,4).map(m=>(m-root+12)%12):[0,3,7,10]; [0,3,6,10].forEach(st=>{if(r()>.32)p[st]=1}); p.tuning=iv} else if(n.includes('Hi-hat')||n.includes('Shaker')){for(let i=0;i<16;i++)if(r()>.52)p[i]=1} else if(n.includes('Bass')){p[0]=1;p[8]=1;p.root=root-24} else{for(let i=0;i<16;i+=4)if(r()>.5)p[i]=1} pat[t]=p; vol[t]=n.includes('Kick')?.72:n.includes('Log')?.66:n.includes('Bass')?.68:0.52; mute[t]=false; solo[t]=false;}); return pat;}
function initMixer(){const sum=(cur.melody||melody||[]).join(',')+cur.title+cur.key+document.getElementById('writer').value; const pat=genPattern(hash(sum),curGenre,cur.melody||melody); pattern=pat; renderMixer(); document.getElementById('kitDesc').textContent=`AFRICAN • ${curGenre.toUpperCase()} • KEY ${cur.key} • BPM ${curBpm} • POLISHED NO CRACKLE`; document.getElementById('kitName').textContent=curGenre+' • Polished African Premium';}
function renderMixer(){const wrap=document.getElementById('tracks'); wrap.innerHTML=''; curKit.tracks.forEach(t=>{const name=t.split('\n')[0]; const bus=(t.split('\n')[1]||'').toUpperCase(); const desc=(t.split('\n')[2]||'').toUpperCase(); const row=document.createElement('div'); row.className='track'; row.innerHTML=`<div class="t-meta"><b>${name}</b><span class="bus">${bus}</span><div class="desc">${desc}</div></div><div style="display:flex;flex-direction:column;gap:3px"><button class="btn" onclick="togM('${t}')" style="padding:3px 6px;font-size:9px">M</button><button class="btn" onclick="togS('${t}')" style="padding:3px 6px;font-size:9px">S</button></div><div style="display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:center"><div class="steps" id="st${name.replace(/\W/g,'')}"></div><div style="display:flex;gap:6px;align-items:center"><input type="range" class="fader" value="${(vol[t]||.6)*100}" oninput="vol['${t}']=this.value/100"><div class="meter"><div class="meter-fill" id="mt${name.replace(/\W/g,'')}"></div></div></div></div>`; wrap.appendChild(row); const sg=row.querySelector('#st'+name.replace(/\W/g,'')); for(let i=0;i<16;i++){const s=document.createElement('div'); s.className='st'; if(pattern[t][i]){s.classList.add('on'); if(name.includes('Log')) s.classList.add('log'); if(name.includes('Bass')) s.classList.add('bass');} s.onclick=()=>{pattern[t][i]=pattern[t][i]?0:1; s.classList.toggle('on')}; sg.appendChild(s);}});}
function togM(t){mute[t]=!mute[t]; toast(mute[t]?'MUTE':'UNMUTE')} function togS(t){solo[t]=!solo[t]; toast(solo[t]?'SOLO':'UNSOLO')}
function renderPiano(){const p=document.getElementById('piano'); p.innerHTML=''; ['C','D','E','F','G','A','B'].forEach(n=>{const d=document.createElement('div'); d.className='pkey'+(cur.key===n?' on':''); d.textContent=n; d.onclick=()=>{activeIdx=['C','D','E','F','G','A','B'].indexOf(n); upd()}; p.appendChild(d);});}
function renderChords(){const el=document.getElementById('chordList'); el.innerHTML=''; DIATONIC.forEach((d,i)=>{const b=document.createElement('div'); b.className='chip'+(i===activeIdx?' on':''); b.textContent=`${d.rn} ${d.n}`; b.onclick=()=>{activeIdx=i; upd()}; el.appendChild(b);}); const wc=document.getElementById('writeChips'); wc.innerHTML=''; DIATONIC.slice(0,4).forEach(d=>{const c=document.createElement('div'); c.className='chip'; c.textContent=d.n; c.onclick=()=>{document.getElementById('lyrics').value+=` [${d.n}]`; saveCur()}; wc.appendChild(c);});}
function upd(){const d=DIATONIC[activeIdx]; document.getElementById('progInfo').textContent=`${d.rn}/${d.n}: ${d.notes.join(' - ')} • ${curKit.desc} • polished`; document.getElementById('bpmLabel').textContent=`${curBpm} BPM • ${d.rn}/${d.n} • ${curGenre}`;}
function tick(){stepPos=(stepPos+1)%16; const tuned=60+NOTES.indexOf(cur.key)+(melody[stepPos%Math.max(1,melody.length)]||0)%12; curKit.tracks.forEach(t=>{const pat=pattern[t]||[]; if(pat[stepPos]){let tu=pat.root||tuned; if((t.includes('Log')||t.includes('Bongo'))&&pat.tuning){const iv=pat.tuning[stepPos%pat.tuning.length]||0; tu=60+NOTES.indexOf(cur.key)+iv} playChannel(t,tu);}}); const c=document.getElementById('wave'),x=c.getContext('2d'); if(c){x.clearRect(0,0,c.width,c.height); x.strokeStyle='#6366F1'; x.beginPath(); for(let i=0;i<c.width;i++){const y=Math.sin(i*.06+stepPos*.6)*6; i===0?x.moveTo(i,17+y):x.lineTo(i,17+y);} x.stroke();}}
function togglePlay(){initAudio(); if(aCtx.state==='suspended') aCtx.resume(); if(isPlaying){clearInterval(timer); isPlaying=false; document.getElementById('playBtn').textContent='▶'; return;} isPlaying=true; document.getElementById('playBtn').textContent='■'; stepPos=0; timer=setInterval(tick,60000/curBpm/4);}
document.getElementById('playBtn').onclick=togglePlay;
function buildGenres(){
 const keySel=document.getElementById('keySel'); NOTES.forEach(n=>{const o=document.createElement('option'); o.value=n; o.textContent=n; keySel.appendChild(o);}); keySel.value=cur.key;
 document.getElementById('genreSel').value=curGenre;
 document.getElementById('genreSel').onchange=e=>setGenre(e.target.value);
}
function setGenre(g){curGenre=g; curKit=KITS[g]; curBpm=curKit.bpm; document.getElementById('bpm').value=curBpm; document.getElementById('genreSel').value=g; initMixer(); upd(); toast(g+' • '+KITS[g].bpm+' BPM • polished');}
document.getElementById('keySel').onchange=e=>{cur.key=e.target.value; initMixer(); upd(); saveCur();}; document.getElementById('bpm').onchange=e=>{curBpm=parseInt(e.target.value)||96; if(isPlaying){clearInterval(timer); timer=setInterval(tick,60000/curBpm/4);} saveCur(); upd();};
function saveCur(){const s=songs.find(x=>x.id===activeId); if(!s) return; s.title=document.getElementById('title').value; s.lyrics=document.getElementById('lyrics').value; s.key=document.getElementById('keySel').value; s.bpm=parseInt(document.getElementById('bpm').value)||96; s.melody=melody; save(); renderList();}
function renderList(){const q=document.getElementById('search').value.toLowerCase(); const list=document.getElementById('songList'); list.innerHTML=''; songs.filter(s=>s.title.toLowerCase().includes(q)).forEach(s=>{const r=document.createElement('div'); r.style.cssText='padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:13px'; r.textContent=s.title; if(s.id===activeId) r.style.borderColor='#6366F1'; r.onclick=()=>{activeId=s.id; cur=s; document.getElementById('title').value=s.title; document.getElementById('lyrics').value=s.lyrics; document.getElementById('keySel').value=s.key; document.getElementById('bpm').value=s.bpm; curBpm=s.bpm; melody=s.melody||[]; initMixer(); renderPiano(); renderChords(); upd(); renderList();}; list.appendChild(r);});}
document.getElementById('title').oninput=saveCur; document.getElementById('lyrics').oninput=saveCur; document.getElementById('search').oninput=renderList;
document.getElementById('newBtn').onclick=()=>{const ns={id:uid(),title:'Untitled',lyrics:'',key:'C',bpm:96,melody:[]}; songs.unshift(ns); activeId=ns.id; cur=ns; save(); renderList(); document.getElementById('title').value=ns.title; document.getElementById('lyrics').value=''; melody=[]; initMixer();};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); b.classList.add('on'); document.querySelectorAll('.view').forEach(v=>v.hidden=true); document.getElementById(b.dataset.tab+'View').hidden=false;});
document.getElementById('genMelody').onclick=()=>{const words=document.getElementById('lyrics').value.split(/\s+/).filter(Boolean).slice(0,32); const ki=NOTES.indexOf(cur.key); const sc=[0,2,4,5,7,9,11]; melody=words.map((w,i)=>60+ki+sc[(i*2)%sc.length]+Math.floor(i/7)*12); cur.melody=melody; document.getElementById('melStat').textContent=`${melody.length} notes • ${curGenre} polished`; saveCur(); initMixer(); initAudio(); if(melody[0]) playChannel('Melodic Plucks\nINSTRUMENTS BUS\nDetuned',melody[0]);};
async function toggleHum(){const btn=document.getElementById('humBtn'); if(humRec&&humRec.state==='recording'){humRec.stop(); humStream.getTracks().forEach(t=>t.stop()); btn.textContent='●'; return;} try{initAudio(); humStream=await navigator.mediaDevices.getUserMedia({audio:true}); const src=aCtx.createMediaStreamSource(humStream); humAna=aCtx.createAnalyser(); humAna.fftSize=2048; src.connect(humAna); humPitches=[]; humRec=new MediaRecorder(humStream); humRec.start(); btn.textContent='■'; (function loop(){if(!humAna) return; const buf=new Float32Array(humAna.fftSize); humAna.getFloatTimeDomainData(buf); const p=autoCorr(buf,aCtx.sampleRate); if(p>60&&p<1000){humPitches.push(p); drawHum(buf);} requestAnimationFrame(loop);})(); setTimeout(()=>{if(humRec&&humRec.state==='recording'){humRec.stop(); humStream.getTracks().forEach(t=>t.stop()); btn.textContent='●'; analyzeHum();}},8000);}catch{toast('Mic needed');}}
function autoCorr(buf,sr){let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length); if(rms<.01) return -1; let c=new Array(buf.length).fill(0); for(let i=0;i<buf.length;i++) for(let j=0;j<buf.length-i;j++) c[i]+=buf[j]*buf[j+i]; let d=0; while(c[d]>c[d+1]) d++; let max=-1,pos=-1; for(let i=d;i<buf.length;i++) if(c[i]>max){max=c[i];pos=i;} return sr/pos;}
function noteFromFreq(f){const n=Math.round(12*Math.log2(f/440))+69; return {midi:n,pc:NOTES[n%12]}}
function drawHum(buf){const c=document.getElementById('humWave'),x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height); x.strokeStyle='#6366F1'; x.beginPath(); for(let i=0;i<c.width;i++){const idx=Math.floor(i/c.width*buf.length); const y=(buf[idx]*.5+.5)*c.height; i===0?x.moveTo(i,y):x.lineTo(i,y);} x.stroke();}
function analyzeHum(){if(humPitches.length<12){toast('Too short'); return;} const notes=humPitches.map(noteFromFreq); const pc={}; notes.forEach(n=>pc[n.pc]=(pc[n.pc]||0)+1); const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]); humKey=sorted[0][0]||'C'; let iv=[]; for(let i=1;i<humPitches.length;i++) if(Math.abs(humPitches[i]-humPitches[i-1])>8) iv.push(i); const avg=iv.length>2?(iv[iv.length-1]-iv[0])/iv.length:20; humBpm=Math.round(60000/(avg*18))||84; if(humBpm<75) humBpm=72; else if(humBpm<90) humBpm=84; else if(humBpm<105) humBpm=96; else if(humBpm<120) humBpm=112; else humBpm=128; humGenre=humBpm<=84?'Lugaflow':humBpm<=100?'Afrobeats':humBpm<=115?'Amapiano':'Gqom'; document.getElementById('humRes').textContent=`Detected Key ${humKey} • ~${humBpm} BPM • ${humGenre}`; document.getElementById('genFromHum').style.display='block';}
document.getElementById('humBtn').onclick=toggleHum;
document.getElementById('genFromHum').onclick=()=>{document.getElementById('keySel').value=humKey; cur.key=humKey; cur.bpm=humBpm; document.getElementById('bpm').value=humBpm; curBpm=humBpm; setGenre(humGenre); melody=humPitches.slice(0,16).map(f=>Math.round(12*Math.log2(f/440)+69)); cur.melody=melody; saveCur(); initMixer(); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='studio')); document.querySelectorAll('.view').forEach(v=>v.hidden=true); document.getElementById('studioView').hidden=false;};
document.getElementById('theme').onclick=()=>{const curT=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme',curT==='dark'?'light':'dark');};
document.getElementById('exportPdf').onclick=()=>{const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text(cur.title,14,20); doc.save(cur.title+'.pdf');};
document.getElementById('waShare').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent(cur.title),'_blank');};
document.getElementById('copyAll').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('lyrics').value); toast('Copied');};
buildGenres(); renderList(); renderPiano(); renderChords(); initMixer(); upd();
</script>
