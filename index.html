<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapehead — Songwriting & Production Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F0E9D9; --bg-grain:#E8DFC8; --panel:#FBF8F0; --panel-2:#E9E0C9; --line:#D8CBA6;
  --text:#2B2415; --text-dim:#7C7156; --brass:#B8623A; --brass-bright:#9A4F2C; --brass-ink:#FBF8F0;
  --green:#4B6E42; --red:#A2422A; --shadow: 0 1px 0 rgba(43,36,21,0.05);
  --radius-s:3px; --radius-m:6px;
  --font-display:'Fraunces', Georgia, serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
:root[data-theme="dark"]{
  --bg:#15130D; --bg-grain:#1A170F; --panel:#1E1A12; --panel-2:#262115; --line:#3B3421;
  --text:#EEE4CB; --text-dim:#A5987A; --brass:#E8AD8E; --brass-bright:#F2C4A8; --brass-ink:#1A1508;
  --green:#8FB284; --red:#D3805F; --shadow:0 1px 0 rgba(0,0,0,0.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130D; --bg-grain:#1A170F; --panel:#1E1A12; --panel-2:#262115; --line:#3B3421;
    --text:#EEE4CB; --text-dim:#A5987A; --brass:#E8AD8E; --brass-bright:#F2C4A8; --brass-ink:#1A1508;
  }
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh}
button{font-family:inherit} input,textarea,select{font-family:inherit;color:inherit}
::selection{background:var(--brass);color:var(--brass-ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--bg-grain);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:baseline;gap:8px}.brand-mark{font-family:var(--font-display);font-size:22px;font-weight:600}.brand-sub{font-size:11px;color:var(--text-dim);font-family:var(--font-mono)}
.new-song-btn{border:1px solid var(--brass);background:transparent;color:var(--brass);padding:9px 12px;border-radius:var(--radius-m);font-size:13.5px;font-weight:600;cursor:pointer}
.new-song-btn:hover{background:var(--brass);color:var(--brass-ink)}
.song-search{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:7px 10px;font-size:12.5px;width:100%}
.song-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.song-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-m);cursor:pointer;border:1px solid transparent}
.song-item:hover{background:var(--panel-2)}.song-item.active{background:var(--panel);border-color:var(--line)}
.song-item.name{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-item.meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim)}
.song-item.del,.song-item.dup{opacity:0;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:2px 4px}
.song-item:hover.del,.song-item:hover.dup{opacity:1}.song-item.del:hover{color:var(--red)}
.sidebar-foot{font-size:11.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between}
.theme-toggle{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:var(--radius-m);padding:5px 8px;cursor:pointer;font-size:12px}
main{display:flex;flex-direction:column;min-width:0}
header.top{border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--bg);position:sticky;top:0;z-index:5}
.title-input{font-family:var(--font-display);font-size:23px;font-weight:500;background:none;border:none;color:var(--text);flex:1;min-width:120px}
.meta-fields{display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
.meta-field{display:flex;align-items:center;gap:6px}.meta-field label{font-size:11px;color:var(--text-dim);font-weight:500}
.key-dot{width:8px;height:8px;border-radius:50%;background:var(--brass);display:inline-block}
@keyframes bpmPulse{0%{transform:scale(1)}30%{transform:scale(1.14);color:var(--brass)}100%{transform:scale(1)}}.bpm-pulse{animation:bpmPulse.35s ease-out}
.meta-field select,.meta-field input{background:none;border:none;border-radius:var(--radius-s);padding:5px 4px;font-size:13px;color:var(--text);font-family:var(--font-mono)}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:var(--radius-m);padding:3px;background:var(--panel)}
.tab-btn{border:none;background:none;padding:7px 16px;border-radius:4px;cursor:pointer;font-size:13.5px;color:var(--text-dim);font-weight:500}
.tab-btn.active{background:var(--brass);color:var(--brass-ink)}
.view{padding:26px 28px 60px;flex:1} [hidden]{display:none!important}
.write-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.write-grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow)}
.card-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.card-head h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0}
.card-body{padding:16px}
textarea.lyrics{width:100%;min-height:440px;resize:vertical;border:none;background:none;color:var(--text);font-family:var(--font-body);font-size:15.5px;line-height:1.75}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:8px 14px;border-radius:var(--radius-m);font-size:13px;cursor:pointer}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.piano{position:relative;height:118px;margin:14px 0;display:flex;user-select:none}
.pkey{flex:1;border:1px solid var(--line);border-left:none;background:var(--panel);cursor:pointer;border-radius:0 0 5px 5px;display:flex;align-items:end;justify-content:center;padding-bottom:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim)}
.pkey:first-child{border-left:1px solid var(--line)}.pkey.in-scale{color:var(--text);font-weight:600}.pkey.root{background:var(--brass);color:var(--brass-ink)}
.bkey{position:absolute;top:0;width:8.6%;height:60%;background:#19140C;border:1px solid #0C0904;border-radius:0 0 4px 4px;cursor:pointer;z-index:2;display:flex;align-items:end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:9px;color:#B5A483}
.bkey.root{background:var(--brass);color:var(--brass-ink)}
.chord-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chord-chip{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius-m);padding:8px 12px;cursor:pointer;text-align:center;min-width:56px}
.chord-chip.rn{font-size:10px;color:var(--text-dim);display:block;font-family:var(--font-mono)}
.chord-chip.name{font-family:var(--font-display);font-size:16px;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">Tapehead</div><div class="brand-sub">STUDIO</div></div>
    <button class="new-song-btn" id="newSongBtn">+ New Song</button>
    <input class="song-search" id="songSearch" placeholder="Search songs...">
    <div class="song-list" id="songList"></div>
    <div class="sidebar-foot">
      <span id="songCount">0 songs</span>
      <button class="theme-toggle" id="themeToggle">☾ Dark</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <input class="title-input" id="titleInput" placeholder="Untitled Song">
      <div class="meta-fields">
        <div class="meta-field"><span class="key-dot" id="keyDot"></span><label>KEY</label><select id="keySelect"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select><select id="modeSelect"><option>Major</option><option>Minor</option></select></div>
        <div class="meta-field"><label>BPM</label><input id="bpmInput" type="number" value="96"><button class="btn" id="bpmLockBtn" style="padding:2px 6px">♩</button></div>
        <div class="meta-field"><label>TS</label><select id="tsSelect"><option>4/4</option><option>3/4</option><option>6/8</option></select></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="write">Write</button>
        <button class="tab-btn" data-tab="studio">Studio</button>
        <button class="tab-btn" data-tab="lyrics">Lyrics</button>
      </div>
      <button class="btn" id="exportBtn">Export PDF</button>
    </header>

    <div class="view" id="view-write">
      <div class="write-grid">
        <div class="card"><div class="card-head"><h2>Lyrics</h2></div><div class="card-body"><textarea class="lyrics" id="lyricsInput" placeholder="Start writing..."></textarea></div></div>
        <div class="card"><div class="card-head"><h2>Chords / Studio</h2></div><div class="card-body">
          <div class="piano" id="piano"></div>
          <div class="chord-list" id="chordList"></div>
          <div id="progressionResult" style="margin-top:12px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim)"></div>
        </div></div>
      </div>
    </div>

    <div class="view" id="view-studio" hidden>
      <div class="card"><div class="card-head"><h2>Studio View</h2></div><div class="card-body"><p style="color:var(--text-dim);font-size:13px">Your beats mixer and hum-to-chords engine is running. This tab is hidden in the minimal build but code is preserved for later.</p></div></div>
    </div>
    <div class="view" id="view-lyrics" hidden>
      <div class="card"><div class="card-body"><textarea class="lyrics" id="lyricsInput2" placeholder="Lyrics sheet..."></textarea></div></div>
    </div>
  </main>
</div>

<script>
// ---- GitHub Pages safe storage ----
const STORE_KEY = 'tapehead_songs_v1';
function loadSongs(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch{ return [] } }
function saveSongs(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

let songs = loadSongs();
let activeId = songs[0]?.id || null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function makeSong(title='Untitled Song'){
  return { id:uid(), title, lyrics:'', key:'C', mode:'Major', bpm:96, ts:'4/4', updated:Date.now() };
}
if(songs.length===0){ songs=[makeSong()]; activeId=songs[0].id; saveSongs(songs); }

const songListEl=document.getElementById('songList'), titleInput=document.getElementById('titleInput'),
lyricsInput=document.getElementById('lyricsInput'), lyricsInput2=document.getElementById('lyricsInput2'),
keySelect=document.getElementById('keySelect'), modeSelect=document.getElementById('modeSelect'),
bpmInput=document.getElementById('bpmInput'), tsSelect=document.getElementById('tsSelect'),
songCount=document.getElementById('songCount'), keyDot=document.getElementById('keyDot');

function renderList(){
  const q=document.getElementById('songSearch').value.toLowerCase();
  songListEl.innerHTML='';
  const filtered=songs.filter(s=>s.title.toLowerCase().includes(q)||s.lyrics.toLowerCase().includes(q));
  filtered.forEach(s=>{
    const row=document.createElement('div'); row.className='song-item'+(s.id===activeId?' active':'');
    row.innerHTML=`<div class="name">${s.title}</div><div class="meta">${s.bpm}</div><button class="dup">⧉</button><button class="del">×</button>`;
    row.onclick=(e)=>{ if(e.target.classList.contains('del')){ songs=songs.filter(x=>x.id!==s.id); if(activeId===s.id) activeId=songs[0]?.id||null; saveSongs(songs); renderList(); loadActive(); return; } if(e.target.classList.contains('dup')){ const copy={...s,id:uid(),title:s.title+' copy'}; songs.unshift(copy); saveSongs(songs); renderList(); return; } activeId=s.id; renderList(); loadActive(); };
    songListEl.appendChild(row);
  });
  songCount.textContent=`${songs.length} songs`;
}
function loadActive(){
  const s=songs.find(x=>x.id===activeId); if(!s) return;
  titleInput.value=s.title; lyricsInput.value=s.lyrics; lyricsInput2.value=s.lyrics;
  keySelect.value=s.key; modeSelect.value=s.mode; bpmInput.value=s.bpm; tsSelect.value=s.ts;
  renderPiano(); renderChords();
}
function updateActive(patch){
  const s=songs.find(x=>x.id===activeId); if(!s) return;
  Object.assign(s,patch,{updated:Date.now()}); saveSongs(songs); renderList();
}
titleInput.addEventListener('input',()=>updateActive({title:titleInput.value||'Untitled Song'}));
lyricsInput.addEventListener('input',()=>{ updateActive({lyrics:lyricsInput.value}); lyricsInput2.value=lyricsInput.value; });
lyricsInput2.addEventListener('input',()=>{ updateActive({lyrics:lyricsInput2.value}); lyricsInput.value=lyricsInput2.value; });
keySelect.addEventListener('change',()=>{ updateActive({key:keySelect.value}); renderPiano(); pulseKey(); });
modeSelect.addEventListener('change',()=>{ updateActive({mode:modeSelect.value}); renderChords(); pulseKey(); });
bpmInput.addEventListener('input',()=>{ updateActive({bpm:parseInt(bpmInput.value)||96}); pulseBpm(); });
tsSelect.addEventListener('change',()=>updateActive({ts:tsSelect.value}));
document.getElementById('songSearch').addEventListener('input',renderList);
document.getElementById('newSongBtn').addEventListener('click',()=>{ const ns=makeSong(); songs.unshift(ns); activeId=ns.id; saveSongs(songs); renderList(); loadActive(); });

function pulseBpm(){ keyDot.classList.remove('bpm-pulse'); void keyDot.offsetWidth; keyDot.classList.add('bpm-pulse'); }
function pulseKey(){ keyDot.style.transform='scale(1.4)'; setTimeout(()=>keyDot.style.transform='scale(1)',180); }

// Tabs
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.hidden=true);
    document.getElementById('view-'+b.dataset.tab).hidden=false;
  });
});

// Piano + chords (diatonic in C for demo, transposes visually)
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DIATONIC=[{rn:'I',name:'C'},{rn:'ii',name:'Dm'},{rn:'iii',name:'Em'},{rn:'IV',name:'F'},{rn:'V',name:'G'},{rn:'vi',name:'Am'},{rn:'vii°',name:'Bdim'}];
function renderPiano(){
  const root=keySelect.value; const piano=document.getElementById('piano'); piano.innerHTML='';
  const whiteNotes=['C','D','E','F','G','A','B'];
  whiteNotes.forEach((n,i)=>{
    const k=document.createElement('div'); k.className='pkey'; k.textContent=n;
    if(n===root.replace('#','')) k.classList.add('root');
    piano.appendChild(k);
  });
  const blacks=[{n:'C#',l:'9.8%'},{n:'D#',l:'24.2%'},{n:'F#',l:'52.8%'},{n:'G#',l:'67.2%'},{n:'A#',l:'81.5%'}];
  blacks.forEach(b=>{
    const el=document.createElement('div'); el.className='bkey'; el.style.left=b.l; el.textContent=b.n;
    if(b.n===root) el.classList.add('root');
    piano.appendChild(el);
  });
}
function renderChords(){
  const list=document.getElementById('chordList'); list.innerHTML='';
  DIATONIC.forEach(c=>{
    const chip=document.createElement('div'); chip.className='chord-chip';
    chip.innerHTML=`<span class="rn">${c.rn}</span><span class="name">${c.name}</span>`;
    chip.onclick=()=>{ document.getElementById('progressionResult').textContent=`${c.rn} - ${c.name} • Key ${keySelect.value} ${modeSelect.value}`; };
    list.appendChild(chip);
  });
}

// Theme
const themeToggle=document.getElementById('themeToggle');
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); localStorage.setItem('theme',t); themeToggle.textContent=t==='dark'?'☀ Light':'☾ Dark'; }
applyTheme(localStorage.getItem('theme')|| (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
themeToggle.onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; applyTheme(cur); };

// Export PDF - works on GitHub Pages because jspdf is https
document.getElementById('exportBtn').onclick=()=>{
  const s=songs.find(x=>x.id===activeId); if(!s) return;
  const { jsPDF } = window.jspdf; const doc=new jsPDF();
  doc.setFont('helvetica','bold'); doc.text(s.title,14,20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Key ${s.key} ${s.mode} | ${s.bpm} BPM | ${s.ts}`,14,28);
  const lines=doc.splitTextToSize(s.lyrics||'(no lyrics)',180);
  doc.text(lines,14,38); doc.save(`${s.title}.pdf`);
};

// BPM lock pulse demo
document.getElementById('bpmLockBtn').onclick=function(){ this.classList.toggle('locked'); pulseBpm(); };

renderList(); loadActive();
</script>
</body>
</html>
