<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tapehead — Songwriting &amp; Production Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
/* ---------- Tokens: light "day session" default, dark "night session" override ---------- */
:root{
  --bg:#F0E9D9;
  --bg-grain:#E8DFC8;
  --panel:#FBF8F0;
  --panel-2:#E9E0C9;
  --line:#D8CBA6;
  --text:#2B2415;
  --text-dim:#7C7156;
  --brass:#B8623A;
  --brass-bright:#9A4F2C;
  --brass-ink:#FBF8F0;
  --green:#4B6E42;
  --red:#A2422A;
  --shadow: 0 1px 0 rgba(43,36,21,0.05);
  --radius-s: 3px;
  --radius-m: 6px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130D;
    --bg-grain:#1A170F;
    --panel:#1E1A12;
    --panel-2:#262115;
    --line:#3B3421;
    --text:#EEE4CB;
    --text-dim:#A5987A;
    --brass:#E8AD8E;
    --brass-bright:#F2C4A8;
    --brass-ink:#1A1508;
    --green:#8FB284;
    --red:#D3805F;
    --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15130D;
  --bg-grain:#1A170F;
  --panel:#1E1A12;
  --panel-2:#262115;
  --line:#3B3421;
  --text:#EEE4CB;
  --text-dim:#A5987A;
  --brass:#E8AD8E;
  --brass-bright:#F2C4A8;
  --brass-ink:#1A1508;
  --green:#8FB284;
  --red:#D3805F;
  --shadow: 0 1px 0 rgba(0,0,0,0.3);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:50; pointer-events:none;
  opacity:0.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:140px 140px;
}
@media (prefers-reduced-motion:reduce), (prefers-contrast:more){
  body::before{display:none;}
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;color:inherit;}
::selection{background:var(--brass); color:var(--brass-ink);}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns:248px 1fr;
  min-height:100vh;
}
.sidebar{
  border-right:1px solid var(--line);
  background:var(--bg-grain);
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand-mark{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:600;
  letter-spacing:-0.01em;
}
.brand-sub{
  font-size:11px;
  color:var(--text-dim);
  font-family:var(--font-mono);
}
.new-song-btn{
  border:1px solid var(--brass);
  background:transparent;
  color:var(--brass);
  padding:9px 12px;
  border-radius:var(--radius-m);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
}
.new-song-btn:hover{background:var(--brass); color:var(--brass-ink);}
.song-search{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:7px 10px; font-size:12.5px; color:var(--text); width:100%;
}
.song-search::placeholder{color:var(--text-dim);}
.song-list{
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow-y:auto;
  flex:1;
}
.song-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  border-radius:var(--radius-m);
  cursor:pointer;
  border:1px solid transparent;
  color:var(--text);
}
.song-item:hover{background:var(--panel-2);}
.song-item.active{background:var(--panel); border-color:var(--line); box-shadow:var(--shadow);}
.song-item .name{
  flex:1;
  font-size:13.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-item .meta{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-dim);
}
.song-item .del, .song-item .dup{
  opacity:0;
  background:none;border:none;color:var(--text-dim);cursor:pointer;
  font-size:13px; padding:2px 4px; border-radius:3px;
}
.song-item:hover .del, .song-item:hover .dup{opacity:1;}
.song-item .del:hover{color:var(--red);}
.song-item .dup:hover{color:var(--brass);}
.sidebar-empty{color:var(--text-dim); font-size:12.5px; padding:8px 4px;}
.sidebar-foot{
  font-size:11.5px;
  color:var(--text-dim);
  border-top:1px solid var(--line);
  padding-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.theme-toggle{
  background:none;border:1px solid var(--line); color:var(--text-dim);
  border-radius:var(--radius-m); padding:5px 8px; cursor:pointer; font-size:12px;
}
.theme-toggle:hover{color:var(--text); border-color:var(--brass);}

/* ---------- Main ---------- */
main{display:flex; flex-direction:column; min-width:0;}
header.top{
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  background:var(--bg);
  position:sticky; top:0; z-index:5;
}
.title-input{
  font-family:var(--font-display);
  font-size:23px;
  font-weight:500;
  background:none;
  border:none;
  color:var(--text);
  min-width:120px;
  flex:1;
}
.title-input::placeholder{color:var(--text-dim);}
.meta-fields{
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:6px 8px 6px 14px;
}
.meta-field{display:flex; align-items:center; gap:6px;}
.meta-field label{font-size:11px; color:var(--text-dim); font-weight:500;}
.meta-icon{font-size:12px; line-height:1;}
.meta-sep{width:1px; align-self:stretch; background:var(--line); margin:0 8px;}
.key-dot{
  width:8px; height:8px; border-radius:50%; background:var(--brass);
  display:inline-block; box-shadow:0 0 0 2px color-mix(in srgb, var(--brass) 25%, transparent);
}
@keyframes bpmPulse{
  0%{ transform:scale(1); }
  30%{ transform:scale(1.14); color:var(--brass); }
  100%{ transform:scale(1); }
}
.bpm-pulse{ animation:bpmPulse .35s ease-out; }
#bpmLockBtn.locked{ color:var(--brass); border-color:var(--brass); }
.meta-field select, .meta-field input{
  background:none;
  border:none;
  border-radius:var(--radius-s);
  padding:5px 4px;
  font-size:13px;
  color:var(--text);
  font-family:var(--font-mono);
  width:auto;
}
.meta-field select{cursor:pointer;}
.meta-field select:focus-visible, .meta-field input:focus-visible{background:var(--panel-2); outline:2px solid var(--brass);}
#bpmInput{width:48px;}
#keySelect{width:44px;}
#modeSelect{width:64px;}
#tsSelect{width:54px;}
.meta-field .btn{padding:4px 8px; font-size:12px;}
.tabs{display:flex; gap:4px; border:1px solid var(--line); border-radius:var(--radius-m); padding:3px; background:var(--panel);}
.tab-btn{
  border:none; background:none; padding:7px 16px; border-radius:4px; cursor:pointer;
  font-size:13.5px; color:var(--text-dim); font-weight:500;
}
.tab-btn.active{background:var(--brass); color:var(--brass-ink);}
.export-menu{position:relative;}
.export-dropdown{
  position:absolute; right:0; top:calc(100% + 6px); z-index:30;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m);
  box-shadow:0 8px 24px rgba(0,0,0,0.18); min-width:210px; padding:4px; display:flex; flex-direction:column;
}
.export-dropdown[hidden]{display:none;}
.export-item{
  background:none; border:none; text-align:left; padding:8px 10px; font-size:13px;
  color:var(--text); cursor:pointer; border-radius:4px;
}
.export-item:hover:not(:disabled){background:var(--panel-2);}
.export-item:disabled{color:var(--text-dim); cursor:default;}

.view{padding:26px 28px 60px; flex:1;}
[hidden]{display:none !important;}

/* ---------- Write view ---------- */
.write-grid{display:grid; grid-template-columns:1.35fr 1fr; gap:22px; align-items:start;}
@media (max-width:900px){.write-grid{grid-template-columns:1fr;}}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  box-shadow:var(--shadow);
}
.card-head{
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.card-head h2{
  font-family:var(--font-display); font-size:16px; font-weight:600; margin:0;
}
.card-body{padding:16px;}

textarea.lyrics{
  width:100%;
  min-height:440px;
  resize:vertical;
  border:none;
  background:none;
  color:var(--text);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.75;
  padding:0;
}
textarea.lyrics::placeholder{color:var(--text-dim);}
.notes-field{
  width:100%; border:none; background:none; color:var(--text-dim); font-size:12.5px;
  border-top:1px solid var(--line); padding-top:10px; margin-top:8px; resize:none; min-height:44px;
}

.assist{display:flex; flex-direction:column; height:600px;}
.assist .card-body{flex:1; display:flex; flex-direction:column; padding:12px; overflow:hidden;}
.quick-actions{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.qa-btn{
  border:1px solid var(--line); background:var(--panel-2); color:var(--text);
  padding:6px 10px; border-radius:14px; font-size:12px; cursor:pointer;
}
.qa-btn:hover{border-color:var(--brass); color:var(--brass);}
.chat-log{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px;}
.msg{max-width:92%; padding:9px 12px; border-radius:10px; font-size:13.8px; white-space:pre-wrap; line-height:1.55;}
.msg.user{align-self:flex-end; background:var(--brass); color:var(--brass-ink); border-bottom-right-radius:2px;}
.msg.assistant{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line); border-bottom-left-radius:2px;}
.msg.system-note{align-self:center; color:var(--text-dim); font-size:12px; background:none;}
.chat-empty{color:var(--text-dim); font-size:13px; margin:auto; text-align:center; padding:20px;}
.chat-input-row{display:flex; gap:8px; margin-top:10px; border-top:1px solid var(--line); padding-top:10px;}
.chat-input-row textarea{
  flex:1; resize:none; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--bg);
  padding:9px 10px; font-size:13.5px; color:var(--text); min-height:40px; max-height:120px;
}
.send-btn{
  border:none; background:var(--brass); color:var(--brass-ink); border-radius:var(--radius-m);
  padding:0 16px; font-size:13.5px; font-weight:600; cursor:pointer;
}
.send-btn:disabled{opacity:0.5; cursor:default;}

/* ---------- Studio view ---------- */
.studio-title{margin-bottom:22px;}
.studio-title h1{font-family:var(--font-display); font-size:32px; font-weight:600; margin:0 0 4px;}
.studio-title p{font-size:13.5px; color:var(--text-dim); margin:0;}

.wizard-steps{display:flex; flex-direction:column; gap:0; margin-bottom:8px;}
.wizard-step{display:flex; gap:16px; align-items:stretch;}
.wizard-step .card{flex:1; min-width:0; margin-bottom:22px;}
.wizard-marker{display:flex; flex-direction:column; align-items:center; width:34px; flex-shrink:0;}
.wizard-circle{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--line); background:var(--panel); color:var(--text-dim); font-weight:700; font-size:14px;
  flex-shrink:0; transition:background .2s ease, border-color .2s ease, color .2s ease;
}
.wizard-circle.done{background:var(--brass); border-color:var(--brass); color:var(--brass-ink);}
.wizard-line{flex:1; width:2px; background:var(--line); margin:4px 0; min-height:20px;}
.wizard-line.done{background:var(--brass);}
.prog-typical{font-size:12px; color:var(--text-dim); font-style:italic; margin-top:8px;}
.jam-card{
  margin-bottom:8px; border:1.5px solid var(--brass);
  background:linear-gradient(160deg, color-mix(in srgb, var(--brass) 10%, var(--panel)), var(--panel));
}
.jam-mixer{display:flex; gap:22px; flex-wrap:wrap; margin:16px 0 4px;}
.jam-channel{display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px;}
.jam-channel label{font-size:11.5px; font-weight:600; color:var(--text-dim);}
.more-tools-label{
  font-size:11.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  color:var(--text-dim); margin:6px 0 14px; padding-top:14px; border-top:1px solid var(--line);
}
.studio-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:20px;}
@media (max-width:640px){
  .wizard-step{gap:10px;}
  .wizard-marker{width:26px;}
  .wizard-circle{width:26px; height:26px; font-size:12px;}
}
.knob-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.readout{
  font-family:var(--font-mono); font-size:30px; font-weight:600; color:var(--brass);
  letter-spacing:-0.02em;
}
.readout small{font-size:12px; color:var(--text-dim); font-weight:400; margin-left:4px;}
.field-inline{display:flex; flex-direction:column; gap:3px;}
.field-inline label{font-size:10.5px; color:var(--text-dim);}
.slider{width:100%; accent-color:var(--brass);}
.btn{
  border:1px solid var(--line); background:var(--panel-2); color:var(--text);
  padding:8px 14px; border-radius:var(--radius-m); font-size:13px; cursor:pointer; font-weight:500;
}
.btn:hover{border-color:var(--brass);}
.btn.primary{background:var(--brass); color:var(--brass-ink); border-color:var(--brass);}
.btn.danger:hover{border-color:var(--red); color:var(--red);}
.btn:disabled{opacity:.45; cursor:default;}
.pulse-dot{width:14px; height:14px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line); transition:background .05s, border-color .05s;}
.pulse-dot.on{background:var(--brass); border-color:var(--brass);}
.pulse-dot.accent{background:var(--red); border-color:var(--red);}

/* Spinning tape reel */
.reel-wrap{display:inline-flex; color:var(--text-dim);}
.reel-wrap svg{display:block; transition:color .25s ease;}
.reel-wrap.active{color:var(--brass);}
.reel-wrap.active svg{animation:reelspin 1.6s linear infinite;}
@keyframes reelspin{to{transform:rotate(360deg);}}

/* Piano keyboard */
.piano{position:relative; height:118px; margin:14px 0; display:flex; user-select:none;}
.pkey{
  position:relative; flex:1; border:1px solid var(--line); border-left:none; background:var(--panel);
  cursor:pointer; border-radius:0 0 5px 5px; display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:8px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim);
  transition:background .1s ease, color .1s ease;
}
.pkey:first-child{border-left:1px solid var(--line); border-radius:5px 0 5px 5px;}
.pkey:hover{background:var(--panel-2);}
.pkey.in-scale{color:var(--text); font-weight:600;}
.pkey.root{background:var(--brass); color:var(--brass-ink); border-color:var(--brass); z-index:1;}
.bkey{
  position:absolute; top:0; width:8.6%; height:60%; background:#19140C; border:1px solid #0C0904;
  border-top:none; border-radius:0 0 4px 4px; cursor:pointer; z-index:2;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px;
  font-family:var(--font-mono); font-size:9px; color:#B5A483;
  transition:background .1s ease;
}
.bkey:hover{background:#292014;}
.bkey.in-scale{box-shadow:inset 0 0 0 2px var(--brass);}
.bkey.root{background:var(--brass); color:var(--brass-ink); box-shadow:none;}

.chord-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.chord-chip{
  border:1px solid var(--line); background:var(--panel-2); border-radius:var(--radius-m);
  padding:8px 12px; cursor:pointer; text-align:center; min-width:56px;
}
.chord-chip:hover{border-color:var(--brass);}
.chord-chip .rn{font-size:10px; color:var(--text-dim); display:block; font-family:var(--font-mono);}
.chord-chip .name{font-family:var(--font-display); font-size:16px; font-weight:600;}
.chord-chip.suggested{border-color:var(--brass);}
#progressionResult{margin-top:10px;}
#progressionResult .prog-note{font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.5;}

.takes-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.take-row{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--line);
  border-radius:var(--radius-m); background:var(--panel-2);
}
.take-row.active{border-color:var(--brass);}
.take-row .take-label{font-size:13px; font-weight:600; flex:1;}
.mic-access-panel{
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:12px 14px; margin-bottom:14px;
}
.mic-access-row{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.mic-status-dot{width:9px; height:9px; border-radius:50%; background:var(--text-dim); flex-shrink:0;}
.mic-status-dot.granted{background:var(--green);}
.mic-status-dot.denied{background:var(--red);}
.take-row .take-time{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
.btn.recording-live{border-color:var(--red); color:var(--red);}

.step-dots{display:flex; gap:4px; margin:14px 0; flex-wrap:wrap;}
.step-dot{width:14px; height:14px; border-radius:3px; background:var(--panel-2); border:1px solid var(--line);}
.step-dot.on{background:var(--brass); border-color:var(--brass);}
.wizard-hint{
  display:none; align-items:center; gap:10px; margin-top:12px; padding:9px 12px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--green) 14%, var(--panel-2)); border:1px solid var(--green);
  border-radius:var(--radius-m); font-size:12.5px; color:var(--text);
}
.wizard-hint.show{display:flex;}
.wizard-hint .btn{padding:6px 11px; font-size:12px;}

.perform-scroll-area{
  margin-top:16px; height:min(60vh, 520px); overflow-y:auto; scroll-behavior:auto;
  border:1px solid var(--line); border-radius:var(--radius-m); background:var(--bg);
  padding:40px 24px;
}
.perform-lyrics{
  font-family:var(--font-display
