<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Tapehead — Mobile Premium Mixer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F0E9D9;--panel:#FBF8F0;--panel2:#E9E0C9;--line:#D8CBA6;--text:#2B2415;--dim:#7C7156;--indigo:#6366F1;--cyan:#06B6D4;--font-d:'Fraunces',serif;--font-b:'Inter',sans-serif;--font-m:'IBM Plex Mono',monospace}
:root[data-theme="dark"]{--bg:#0A0A0C;--panel:#16161A;--panel2:#1C1C20;--line:#27272A;--text:#F8FAFC;--dim:#94A3B8;--brass:#E8AD8E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button,input,select{min-height:42px}
.app{min-height:100svh}
.sidebar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-d);font-weight:600;align-self:center}
.brand small{font-family:var(--font-m);font-size:8px;color:var(--dim);display:block}
#songList{grid-column:1/-1;display:flex;gap:6px;overflow:auto;scrollbar-width:none}
#songList::-webkit-scrollbar{display:none}
.song-item{flex:0 0 auto;padding:8px 11px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--panel);font-size:12px}
.song-item.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.top{position:sticky;top:70px;z-index:20;display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
#title{width:100%;min-width:0;background:none;border:0;font-family:var(--font-d);font-size:20px;outline:none}
.meta{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 6px}
.meta span{font-family:var(--font-m);font-size:8px;color:var(--dim)}
.meta input{width:50px;background:none;border:0}
.meta select{max-width:80px;background:none;border:0}
.tabs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:8px;border:0;border-radius:7px;background:none;color:var(--dim);cursor:pointer}
.tab.on{background:var(--indigo);color:#fff;font-weight:600}
.view{padding:12px 12px 72px}
[hidden]{display:none!important}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.12);margin-bottom:12px;content-visibility:auto;contain:layout paint style}
.card-h{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-h h2{font-family:var(--font-d);margin:0;font-size:15px}
.card-b{padding:12px}
.lyrics{width:100%;min-height:42svh;border:0;background:none;resize:vertical;font-size:16px;line-height:1.65;outline:none}
.btn{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}
.btn.pri{background:var(--indigo);color:#fff;border-color:var(--indigo);font-weight:600}
.play{width:48px;height:48px;border-radius:50%;background:var(--indigo);color:#fff;border:0;font-weight:900;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--font-m);font-size:10px;cursor:pointer}
.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.piano{position:relative;height:84px;display:flex;margin:8px 0;touch-action:manipulation}
.pkey{flex:1;border:1px solid var(--line);border-left:0;background:var(--panel);border-radius:0 0 8px 8px;display:flex;align-items:end;justify-content:center;padding-bottom:6px;font-size:11px;cursor:pointer}
.pkey.on{background:var(--indigo);color:#fff}
.bkey{position:absolute;top:0;width:28px;height:52px;background:#0A0A0C;border-radius:0 0 6px 6px;z-index:2}
.mixer{background:rgba(14,14,16,.96);overflow:hidden}
.mix-head,.transport{padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.mix-head{justify-content:space-between;background:linear-gradient(180deg,#1C1C20,#121214)}
.transport{flex-wrap:wrap;background:var(--panel)}
.transport-info{min-width:0}
.transport-info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport-controls{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.genre-section{padding:8px 10px}
.genre-label{font-family:var(--font-m);font-size:8px;letter-spacing:1px;color:var(--dim);margin:6px 0 4px}
.genre-row{display:flex;gap:6px;overflow:auto;flex-wrap:nowrap;scrollbar-width:none}
.genre-row::-webkit-scrollbar{display:none}
.track{display:grid;grid-template-columns:82px 52px 1fr;gap:6px;padding:7px 8px;border-top:1px solid #1E1E20;align-items:center;min-width:680px}
.track-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t-meta{font-family:var(--font-m);font-size:7px;color:var(--dim);text-align:center}
.t-meta b{font-size:8px;color:var(--text);display:block}
.bus{font-size:6px;background:var(--cyan);color:#000;padding:2px 5px;border-radius:999px;font-weight:700;display:inline-block;margin-top:2px}
.steps{display:grid;grid-template-columns:repeat(16,minmax(22px,1fr));gap:3px}
.st{height:28px;border-radius:6px;background:#18181B;border:1px solid #27272A;cursor:pointer}
.st.on{background:var(--indigo)}
.st.log.on{background:#7A9A7A}.st.bass.on{background:#C4623B}.st.vocal.on{background:#8A7ABF}
.fader{width:60px;accent-color:var(--indigo)}
.meter{width:42px;height:4px;background:#0A0A0C;border-radius:999px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--cyan));width:40%}
.wave{width:100%;height:64px;background:#0A0A0C;border:1px solid var(--line);border-radius:8px}
.bottom-actions{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.bottom-actions .btn{flex:1}
@media (min-width:760px){
 .app{display:grid;grid-template-columns:240px 1fr}
 .sidebar{position:fixed;inset:0 auto 0 0;width:240px;height:100svh;display:flex;flex-direction:column;padding:16px;border-right:1px solid var(--line);border-bottom:0}
 #songList{display:flex;flex-direction:column;overflow:auto}
 .song-item{border-radius:8px}
 main{margin-left:240px}
 .top{top:0;grid-template-columns:1fr auto}
 .view{padding:18px 20px 60px}
 .bottom-actions{display:none}
 .lyrics{min-height:320px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Tapehead <small>12 GENRES • PREMIUM</small></div>
  <button class="btn pri" id="newBtn">+ New Song</button>
  <input id="search" placeholder="Search songs..." aria-label="Search songs">
  <div id="songList"></div>
  <button id="theme" class="btn">◐ Theme</button>
</aside>

<main>
<header class="top">
  <input id="title" placeholder="Untitled" aria-label="Song title">
  <div class="meta">
    <span>KEY</span><select id="keySel"></select><select id="modeSel"><option value="major">Major</option><option value="minor">Minor</option></select>
    <span>BPM</span><input id="bpm" type="number" value="96" inputmode="numeric" aria-label="BPM">
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="write">Write</button>
    <button class="tab" data-tab="studio">Studio</button>
    <button class="tab" data-tab="publish">Publish</button>
  </div>
</header>

<section class="view" id="writeView">
  <div class="card">
    <div class="card-h"><h2>Lyrics</h2><span id="save" style="font-family:var(--font-m);font-size:10px;color:var(--dim)">Saved locally</span></div>
    <div class="card-b">
      <textarea id="lyrics" class="lyrics" placeholder="Verse 1... use [C - G - Am - F] to lock"></textarea>
      <div id="writeChips" class="chips" style="margin-top:8px"></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="genMelody">Generate melody + unique beat</button><span id="melStat" style="font-family:var(--font-m);font-size:10px;color:var(--dim)"></span>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-b">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="play" id="humBtn" aria-label="Record hum">●</button>
        <div><b>Hum your melody</b><div style="font-family:var(--font-m);font-size:9px;color:var(--dim)">Detect key, tempo and genre</div></div>
        <input id="writer" value="Writer 01" style="margin-left:auto;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)">
      </div>
      <canvas id="humWave" class="wave" width="400" height="64" style="margin-top:10px"></canvas>
      <div id="humRes" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px">No hum yet</div>
      <button id="genFromHum" class="btn pri" style="width:100%;margin-top:8px;display:none">GENERATE PREMIUM MIXER →</button>
    </div>
  </div>
</section>

<section class="view" id="studioView" hidden>
  <div class="card">
    <div class="card-h"><h2>Key & Chords</h2><span id="progInfo" style="font-family:var(--font-m);font-size:10px;color:var(--dim)"></span></div>
    <div class="card-b"><div id="piano" class="piano"></div><div id="chordList" class="chips"></div></div>
  </div>
  <div class="card mixer">
    <div class="mix-head"><b id="kitName" style="font-family:var(--font-d);font-size:13px">Premium Mixer</b><span id="kitDesc" style="font-family:var(--font-m);font-size:7px;background:#0A0A0C;padding:5px 8px;border-radius:999px;border:1px solid var(--line)">PREMIUM SOUND</span></div>
    <div class="transport">
      <button class="play" id="playBtn">▶</button>
      <div class="transport-info"><div id="bpmLabel" style="font-family:var(--font-d);font-weight:700">96 BPM • I / C</div><div id="instLabel" style="font-family:var(--font-m);font-size:7px;color:var(--dim)">MASTER BUS • COMP • REVERB • DELAY</div></div>
      <div class="transport-controls">
        <label style="font-size:10px">Reverb <input id="revSend" type="range" min="0" max="100" value="18" class="fader"></label>
        <label style="font-size:10px">LowPass <input id="masterFilt" type="range" min="0" max="100" value="100" class="fader"></label>
      </div>
    </div>
    <div class="genre-section">
      <div class="genre-label">AFRICAN • 6 GENRES</div><div class="genre-row" id="afroRow"></div>
      <div class="genre-label">WESTERN • 6 GENRES</div><div class="genre-row" id="westRow"></div>
    </div>
    <div class="track-scroll"><div id="tracks"></div></div>
    <div style="display:grid;grid-template-columns:92px 1fr;height:46px;background:#121214;border-top:2px solid var(--indigo)">
      <div style="padding:6px 8px"><div style="font-family:var(--font-m);font-size:7px;color:var(--dim)">MASTER • LIMITER</div><div class="meter"><div id="masterMeter" class="meter-fill"></div></div></div>
      <canvas id="masterWave" width="300" height="30" style="width:100%;height:30px"></canvas>
    </div>
    <div style="height:34px;background:#0A0A0C;border-top:1px solid var(--line)"><canvas id="wave" width="400" height="34" style="width:100%;height:100%"></canvas></div>
  </div>
</section>

<section class="view" id="publishView" hidden>
  <div class="card" style="max-width:560px;margin:0 auto"><div class="card-b">
    <h2 style="font-family:var(--font-d)">Publish</h2><canvas id="pubWave" class="wave" style="height:90px"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" id="renderDemo">Render 30s Demo</button><button class="btn" id="dlDemo" disabled>Download WAV</button></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="waShare" style="background:#25D366;color:#000">WhatsApp</button><button class="btn" id="copyAll">Copy lyrics</button></div>
    <div id="pubStat" style="font-family:var(--font-m);font-size:10px;color:var(--dim);margin-top:8px"></div>
  </div></div>
</section>
</main>
</div>

<div class="bottom-actions">
  <button class="btn" id="bottomWrite">Write</button>
  <button class="btn pri" id="bottomPlay">▶ Play</button>
  <button class="btn" id="bottomStudio">Studio</button>
</div>

<script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const DIATONIC=[{rn:'I',n:'C',notes:['C','E','G'],b:'C2'},{rn:'ii',n:'Dm',notes:['D','F','A'],b:'D2'},{rn:'iii',n:'Em',notes:['E','G','B'],b:'E2'},{rn:'IV',n:'F',notes:['F','A','C'],b:'F2'},{rn:'V',n:'G',notes:['G','B','D'],b:'G2'},{rn:'vi',n:'Am',notes:['A','C','E'],b:'A2'},{rn:'vii°',n:'Bdim',notes:['B','D','F'],b:'B2'}];
// 6 African + 6 Western with premium sound design
const KITS={
 // AFRICAN 6
 'Afrobeats':{bpm:96,region:'african',desc:'Log Drum FM • tuned to melody • Drums + Perc + Bass buses',tracks:['Kick\nDRUMS BUS\nPunchy Afro','Snare / Clap\nDRUMS BUS\nCrispy','Log Drum\nPERCUSSION BUS • premium FM tuned','Hi-hats / Shakers\nPERCUSSION BUS\nBounce','Bass 808\nBASS BUS\nFollows melody root','Melodic Plucks\nINSTRUMENTS BUS','Lead Vocal\nVOCALS BUS','FX / Reverb\nFX BUS'],prog:['I','V','vi','IV'],sound:{kick:'afro_punch',snare:'crisp',log:'fm'}},
 'Lugaflow':{bpm:84,region:'african',desc:'Ugandan warm • light rim • adungu guitar',tracks:['Kick\nDRUMS BUS\nWarm','Snare / Rim\nDRUMS BUS\nLight rimshot','Hi-hats / Shakers\nPERCUSSION BUS\nSoft','Bass 808 Warm\nBASS BUS\nUgandan warm','Guitars / Adungu\nINSTRUMENTS BUS\nClean','Background Vocals\nVOCALS BUS','Lead Vocal\nVOCALS BUS • intimate','FX / Atmosphere\nFX BUS\nWide'],prog:['vi','IV','I','V'],sound:{kick:'warm',snare:'rim',log:'soft'}},
 'Amapiano':{bpm:112,region:'african',desc:'Deep log • house deep • premium pad',tracks:['Deep Kick\nDRUMS BUS\nSub deep','Log Bass\nPERCUSSION BUS • premium tuned to hum','Shaker\nPERCUSSION BUS\nSilky','Bass Deep\nBASS BUS\nLog slide','Pad\nINSTRUMENTS BUS\nWarm','Choir / Vox\nVOCALS BUS\nAiry'],prog:['vi','IV','I','iii'],sound:{kick:'deep',snare:'log',log:'deep'}},
 'Bongo Flava':{bpm:98,region:'african',desc:'Tanzanian guitar bounce • rim • pluck',tracks:['Kick\nDRUMS BUS','Rim\nDRUMS BUS\nTight','Bongo / Conga\nPERCUSSION BUS','Bass\nBASS BUS\nRound','Guitar\nINSTRUMENTS BUS\nBongo clean','Keys / Plucks\nINSTRUMENTS BUS'],prog:['I','V','vi','IV'],sound:{kick:'bongo',snare:'rim',log:'bongo'}},
 'Gqom':{bpm:128,region:'african',desc:'Durban hard • distorted log • dark',tracks:['Gqom Kick\nDRUMS BUS\nHard distorted','Log Drum Hard\nPERCUSSION BUS\nDark FM','Clap\nDRUMS BUS\nHard','Bass\nBASS BUS\nGqom slide','Dark Pad\nINSTRUMENTS BUS','FX / Noise\nFX BUS'],prog:['vi','IV','iii','ii'],sound:{kick:'hard',snare:'hard',log:'dist'}},
 'Highlife':{bpm:100,region:'african',desc:'Ghana highlife • conga • horn • bright guitar',tracks:['Kick\nDRUMS BUS\nBright','Snare\nDRUMS BUS\nSnappy','Conga / Perc\nPERCUSSION BUS\nHighlife','Bass\nBASS BUS\nHighlife round','Guitar\nINSTRUMENTS BUS\nHighlife bright','Horns / Brass\nINSTRUMENTS BUS\nPremium'],prog:['I','IV','V','I'],sound:{kick:'bright',snare:'snappy',log:'conga'}},
 // WESTERN 6
 'Pop':{bpm:100,region:'western',desc:'Punchy pop • supersaw • modern',tracks:['Pop Kick\nDRUMS BUS\nPunchy','Snare\nDRUMS BUS\nPop crisp','Hi-Hat\nPERCUSSION BUS\nClosed','Bass\nBASS BUS\nPop','Supersaw\nINSTRUMENTS BUS\nPremium','Lead Vocal\nVOCALS BUS\nPresent'],prog:['I','V','vi','IV'],sound:{kick:'pop',snare:'pop',log:'pop'}},
 'Hip-Hop':{bpm:88,region:'western',desc:'Vinyl boom bap • Rhodes • chop',tracks:['Vinyl Kick\nDRUMS BUS\nBoom bap','Snare\nDRUMS BUS\nVinyl','Hi-Hat\nPERCUSSION BUS\nLoose','Bass\nBASS BUS\nWarm','Rhodes\nINSTRUMENTS BUS\nSilky','Vocal Chop\nVOCALS BUS'],prog:['vi','IV','I','V'],sound:{kick:'vinyl',snare:'vinyl',log:'rhodes'}},
 'Trap':{bpm:140,region:'western',desc:'808 slide • triplet hats • bell',tracks:['Trap Kick\nDRUMS BUS\n808 punch','Snare\nDRUMS BUS\nTrap snap','Hat Roll\nPERCUSSION BUS\nTriplet','808 Slide\nBASS BUS\nSlide premium','Bell / Pluck\nINSTRUMENTS BUS\nDark','Lead Vocal\nVOCALS BUS'],prog:['vi','III','VII','iv'],sound:{kick:'trap',snare:'trap',log:'808'}},
 'R&B':{bpm:72,region:'western',desc:'Silky • brush • neo-soul Rhodes',tracks:['Soft Kick\nDRUMS BUS\nSoft','Brush Snare\nDRUMS BUS\nBrush','Shaker\nPERCUSSION BUS\nSoft','Bass\nBASS BUS\nSilky R&B','Guitar\nINSTRUMENTS BUS\nClean','Rhodes\nINSTRUMENTS BUS\nPremium'],prog:['I','iii','vi','ii'],sound:{kick:'soft',snare:'brush',log:'rhodes'}},
 'House':{bpm:124,region:'western',desc:'Four-on-floor • off-hat • stab',tracks:['Four Kick\nDRUMS BUS\nFour floor','Clap\nDRUMS BUS\nHouse clap','Off-Hat\nPERCUSSION BUS\nOff beat','Bass\nBASS BUS\nHouse','Stab\nINSTRUMENTS BUS\nChord stab','Pad\nINSTRUMENTS BUS\nWarm'],prog:['vi','IV','I','V'],sound:{kick:'house',snare:'house',log:'stab'}},
 'EDM':{bpm:128,region:'western',desc:'Big room • anthem • supersaw',tracks:['Big Kick\nDRUMS BUS\nBig','Snare\nDRUMS BUS\nAnthem','Hi-Hat\nPERCUSSION BUS\nDriving','Bass\nBASS BUS\nEDM','Supersaw\nINSTRUMENTS BUS\nAnthem','FX / Uplift\nFX BUS'],prog:['I','V','vi','IV'],sound:{kick:'big',snare:'anthem',log:'saw'}},
};
let curGenre='Afrobeats',curKit=KITS[curGenre],curBpm=96,activeIdx=0,writerSeed=1,melody=[],pattern={},vol={},mute={},solo={},isPlaying=false,timer=null,stepPos=0,aCtx,master,comp,revNode,delayNode,masterFilt,noiseBuf,demoBlob=null;
let humStream=null,humRec=null,humAna=null,humPitches=[],humKey='C',humBpm=96,humGenre='Afrobeats',humChords=[0,4,5,3];
let songs=JSON.parse(localStorage.getItem('tapehead_12g_v1')||'[]'); let activeId=songs[0]?.id||null;
function uid(){return Math.random().toString(36).slice(2,9)} function save(){localStorage.setItem('tapehead_12g_v1',JSON.stringify(songs))}
if(!songs.length){songs=[{id:uid(),title:'Untitled song',lyrics:'',key:'C',bpm:96,melody:[]}]; activeId=songs[0].id; save()}
let cur=songs.find(s=>s.id===activeId)||songs[0];
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i); h|=0} return Math.abs(h)||1}
function seeded(seed){let s=seed%2147483647; return()=>{s=(s*16807)%2147483647; return (s-1)/2147483646}}

function initAudio(){ if(aCtx) return; aCtx=new (window.AudioContext||window.webkitAudioContext)(); noiseBuf=aCtx.createBuffer(1,aCtx.sampleRate,aCtx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; master=aCtx.createGain(); master.gain.value=.92; comp=aCtx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; masterFilt=aCtx.createBiquadFilter(); masterFilt.type='lowpass'; masterFilt.frequency.value=20000; revNode=aCtx.createConvolver(); const len=aCtx.sampleRate*2.2; const imp=aCtx.createBuffer(2,len,aCtx.sampleRate); for(let ch=0;ch<2;ch++){ const dat=imp.getChannelData(ch); for(let i=0;i<len;i++) dat[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2)*.6; } revNode.buffer=imp; const revGain=aCtx.createGain(); revGain.gain.value=.18; const revFilt=aCtx.createBiquadFilter(); revFilt.frequency.value=3500; revNode.connect(revFilt); revFilt.connect(revGain); revGain.connect(comp); delayNode=aCtx.createDelay(1); delayNode.delayTime.value=.32; const dGain=aCtx.createGain(); dGain.gain.value=.18; delayNode.connect(dGain); dGain.connect(comp); master.connect(masterFilt); masterFilt.connect(comp); comp.connect(aCtx.destination); document.getElementById('revSend').oninput=e=>{revGain.gain.value=e.target.value/100}; document.getElementById('masterFilt').oninput=e=>{masterFilt.frequency.value=200+ (e.target.value/100)*18000}; }
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}// PREMIUM SOUND ENGINE - different per genre
function playChannel(trackName,tunedMidi){
 const t=aCtx.currentTime; const name=trackName.split('\n')[0]; const v=vol[trackName]||.7; if(mute[trackName]) return; if(Object.values(solo).some(Boolean)&&!solo[trackName]) return;
 const dest=master; const sound=curKit.sound||{};
 const rootMidi=tunedMidi||60+NOTES.indexOf(cur.key);
 // KICK PREMIUM PER GENRE
 if(name.includes('Kick')){
  const o=aCtx.createOscillator(),g=aCtx.createGain();
  let startF=120, endF=38, decay=.5;
  if(sound.kick==='warm'){startF=100; endF=42; decay=.6;}
  if(sound.kick==='deep'){startF=90; endF=32; decay=.7;}
  if(sound.kick==='hard'){startF=160; endF=30; decay=.45;}
  if(sound.kick==='bongo'){startF=110; endF=45; decay=.4;}
  if(sound.kick==='bright'){startF=130; endF=50; decay=.38;}
  if(sound.kick==='pop'||sound.kick==='big'){startF=140; endF=36; decay=.48;}
  if(sound.kick==='vinyl'){startF=105; endF=38; decay=.55;}
  if(sound.kick==='trap'){startF=150; endF=32; decay=.42;}
  if(sound.kick==='house'){startF=125; endF=35; decay=.5;}
  if(sound.kick==='soft'){startF=90; endF=48; decay=.35;}
  o.frequency.setValueAtTime(startF,t); o.frequency.exponentialRampToValueAtTime(endF,t+decay);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+decay+.1);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+decay+.2); return;
 }
 if(name.includes('Snare')||name.includes('Clap')||name.includes('Rim')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),g=aCtx.createGain();
  f.type=sound.snare==='rim'?'bandpass':'highpass'; f.frequency.value=sound.snare==='brush'?1200:sound.snare==='rim'?1800:sound.snare==='vinyl'?2000:1700;
  g.gain.setValueAtTime(v*(sound.snare==='brush'?.28:.5),t); g.gain.exponentialRampToValueAtTime(.001,t+(sound.snare==='brush'?.35:.18));
  b.connect(f); f.connect(g); g.connect(dest); b.start(t); b.stop(t+.25); return;
 }
 // LOG DRUM - PREMIUM UNIQUE TUNED PER MELODY + GENRE
 if(name.includes('Log')||name.includes('Bongo')||name.includes('Conga')){
  const baseMidi=rootMidi-12 + (sound.log==='deep'?-2:sound.log==='dist'?0:0);
  const o=aCtx.createOscillator(),g=aCtx.createGain(),filt=aCtx.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(midiFreq(baseMidi),t);
  const fm=aCtx.createOscillator(),fg=aCtx.createGain(); fm.frequency.value=midiFreq(baseMidi)* (sound.log==='fm'?1.5:sound.log==='dist'?2.2:1.2); fg.gain.value=sound.log==='fm'?220:sound.log==='dist'?320:120;
  fm.connect(fg); fg.connect(o.frequency);
  filt.type='lowpass'; filt.frequency.value=sound.log==='dist'?1200:sound.log==='bongo'?1400:sound.log==='deep'?700:900;
  g.gain.setValueAtTime(v*.85,t); g.gain.exponentialRampToValueAtTime(.001,t+.65);
  o.connect(filt); filt.connect(g); g.connect(dest); g.connect(revNode);
  fm.start(t); o.start(t); fm.stop(t+.3); o.stop(t+.7); return;
 }
 if(name.includes('Hi-hat')||name.includes('Shaker')||name.includes('Hat')||name.includes('Off-Hat')){
  const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),g=aCtx.createGain(); f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(v*.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.08); b.connect(f); f.connect(g); g.connect(dest); b.start(t); b.stop(t+.1); return;
 }
 if(name.includes('Bass')||name.includes('808')){
  const baseMidi=36+NOTES.indexOf(cur.key)+(sound.log==='deep'?-2:0); const o=aCtx.createOscillator(),g=aCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(midiFreq(baseMidi + (sound.log==='808'? (melody[0]%12||0) :0)),t); g.gain.setValueAtTime(v*.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.9); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.9); return;
 }
 if(name.includes('Melodic')||name.includes('Plucks')||name.includes('Guitar')||name.includes('Supersaw')||name.includes('Pad')||name.includes('Horn')||name.includes('Stab')||name.includes('Rhodes')||name.includes('Bell')){
  const d=DIATONIC[activeIdx]; const nf={C:60,D:62,E:64,F:65,G:67,A:69,B:71};
  d.notes.forEach((nn,i)=>{
   const o=aCtx.createOscillator(),g=aCtx.createGain();
   o.type=sound.log==='saw'||sound.log==='pop'?'sawtooth':sound.log==='rhodes'?'sine':'triangle';
   o.frequency.value=midiFreq((nf[nn]||60)+12 + (sound.log==='rhodes'?0:0));
   g.gain.setValueAtTime(v*.13,t+i*.03); g.gain.exponentialRampToValueAtTime(.001,t+1);
   o.connect(g); g.connect(dest); if(sound.log!=='rhodes') g.connect(delayNode); o.start(t+i*.03); o.stop(t+1.1);
  }); return;
 }
 if(name.includes('Vocal')||name.includes('Choir')){ const d=DIATONIC[activeIdx]; const o=aCtx.createOscillator(),g=aCtx.createGain(); o.type='sawtooth'; o.frequency.value=midiFreq(60+NOTES.indexOf(d.notes[0])); g.gain.setValueAtTime(v*.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.5); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.55); return; }
 const b=aCtx.createBufferSource(); b.buffer=noiseBuf; const f=aCtx.createBiquadFilter(),g=aCtx.createGain(); f.type='lowpass'; f.frequency.value=1200; g.gain.setValueAtTime(v*.18,t); g.gain.exponentialRampToValueAtTime(.001,t+1.2); b.connect(f); f.connect(g); g.connect(dest); g.connect(revNode); b.start(t); b.stop(t+1.2);
}

function genUniquePattern(seed,genre,melNotes){
 const r=seeded(seed); const rootMidi=60+NOTES.indexOf(cur.key); const melHash=melNotes?.length? melNotes.reduce((a,m)=>a+m,0)%12 : 0;
 const pat={}; curKit.tracks.forEach(t=>{
  const n=t.split('\n')[0]; let p=new Array(16).fill(0);
  if(n.includes('Kick')){ p[0]=1; p[8]=1; if(r()>.5) p[10]=1; if(genre==='Amapiano'&&r()>.4) p[4]=1; if(genre==='Gqom'&&r()>.3) p[2]=1; if(genre==='House') {p=new Array(16).fill(0); p[0]=1; p[4]=1; p[8]=1; p[12]=1;} if(genre==='Trap'&&r()>.6) p[11]=1; }
  else if(n.includes('Snare')||n.includes('Clap')){ p[4]=1; p[12]=1; if(genre==='Trap'&&r()>.5) p[6]=1; }
  else if(n.includes('Log')||n.includes('Bongo')||n.includes('Conga')){ const intervals=melNotes?.length? melNotes.slice(0,4).map(m=>(m-rootMidi+12)%12) : [0,3,7,10]; const steps=[0,3,6,10,14]; steps.forEach((st,i)=>{ if(r()>.25) p[st]=1; }); p.tuning=intervals; }
  else if(n.includes('Hi-hat')||n.includes('Shaker')||n.includes('Hat')){ for(let i=0;i<16;i++) if(r()>.42) p[i]=1; if(genre==='Trap') for(let i=0;i<16;i++) if(r()>.68) p[i]=1; }
  else if(n.includes('Bass')||n.includes('808')){ p[0]=1; p[8]=1; if(melHash>6&&r()>.5) p[6]=1; p.root=rootMidi-24+melHash%5; }
  else if(n.includes('Melodic')||n.includes('Guitar')||n.includes('Supersaw')||n.includes('Pad')||n.includes('Stab')){ for(let i=0;i<16;i+=4) if(r()>.4) p[i]=1; }
  else if(n.includes('Vocal')){ if(r()>.5) p[4]=1; }
  pat[t]=p; vol[t]=n.includes('Lead')?.92:n.includes('Log')?.84:n.includes('Bass')?.86:n.includes('Kick')?.9:.62; mute[t]=false; solo[t]=false;
 }); return pat;
}

  els.masterMeter.style.width=(55+Math.random()*35)+'%';
  const c=els.wave,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#6366F1';x.beginPath();
  for(let i=0;i<c.width;i++){const y=Math.sin(i*.06+stepPos*.6+activeIdx)*6;i===0?x.moveTo(i,17+y):x.lineTo(i,17+y);}x.stroke();

  for(let i=0;i<cm.width;i++){const y=Math.sin(i*.08+stepPos)*6;i===0?cmx.moveTo(i,15+y):cmx.lineTo(i,15+y);}cmx.stroke();
}

  if(humRec&&humRec.state==='recording'){humRec.stop();humStream.getTracks().forEach(t=>t.stop());btn.textContent='●';return;}
  try{
    initAudio();humStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const src=aCtx.createMediaStreamSource(humStream);humAna=aCtx.createAnalyser();humAna.fftSize=2048;src.connect(humAna);humPitches=[];
    humRec=new MediaRecorder(humStream);humRec.start();btn.textContent='■';$('humRes').textContent='Listening…';
    (function loop(){if(!humAna)return;const buf=new Float32Array(humAna.fftSize);humAna.getFloatTimeDomainData(buf);const p=autoCorr(buf,aCtx.sampleRate);if(p>60&&p<1000){humPitches.push(p);drawHum(buf,p);}pitchLoop=requestAnimationFrame(loop);})();
    setTimeout(()=>{if(humRec&&humRec.state==='recording'){humRec.stop();humStream.getTracks().forEach(t=>t.stop());btn.textContent='●';analyzeHum();}},8000);
  }catch{alert('Microphone permission is needed.');}
}
function autoCorr(buf,sr){let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);if(rms<.01)return -1;let c=new Array(buf.length).fill(0);for(let i=0;i<buf.length;i++)for(let j=0;j<buf.length-i;j++)c[i]+=buf[j]*buf[j+i];let d=0;while(c[d]>c[d+1])d++;let max=-1,pos=-1;for(let i=d;i<buf.length;i++)if(c[i]>max){max=c[i];pos=i;}return sr/pos;}
function noteFromFreq(f){const n=Math.round(12*Math.log2(f/440))+69;return{midi:n,pc:NOTES[n%12].replace('#',''),freq:f};}
function drawHum(buf,p){const c=$('humWave'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#6366F1';x.beginPath();for(let i=0;i<c.width;i++){const idx=Math.floor(i/c.width*buf.length),y=(buf[idx]*.5+.5)*c.height;i===0?x.moveTo(i,y):x.lineTo(i,y);}x.stroke();x.fillStyle='#94A3B8';x.font='10px IBM Plex Mono';x.fillText(p.toFixed(0)+' Hz',10,14);}
function analyzeHum() {
  cancelAnimationFrame(pitchLoop);if(humPitches.length<12){$('humRes').textContent='Too short';return;}
  const notes=humPitches.map(noteFromFreq).filter(n=>n.midi>=48&&n.midi<=84),pc={};notes.forEach(n=>pc[n.pc]=(pc[n.pc]||0)+1);
  const sorted=Object.entries(pc).sort((a,b)=>b[1]-a[1]);humKey=sorted[0][0]||'C';const uniq=[...new Set(notes.map(n=>n.pc))];
  humChords=uniq.map(p=>({C:0,D:1,E:2,F:3,G:4,A:5,B:6}[p]??0)).slice(0,4);if(humChords.length<3)humChords=[0,4,5,3];
  let iv=[];for(let i=1;i<humPitches.length;i++)if(Math.abs(humPitches[i]-humPitches[i-1])>8)iv.push(i);const avg=iv.length>2?(iv[iv.length-1]-iv[0])/iv.length:20;
  humBpm=Math.round(60000/(avg*18))||84;if(humBpm<75)humBpm=70;else if(humBpm<90)humBpm=84;else if(humBpm<105)humBpm=96;else if(humBpm<120)humBpm=112;else humBpm=128;
  if(humBpm<=72)humGenre='Gospel Worship';else if(humBpm<=86)humGenre=sorted.some(s=>['D','E','A'].includes(s[0]))?'Lugaflow':'R&B';else if(humBpm<=100)humGenre='Afrobeats';else if(humBpm<=115)humGenre='Amapiano';else humGenre='Gqom';
  $('humRes').textContent=`Detected Key ${humKey} • ${uniq.join(' - ')} • ~${humBpm} BPM • Auto Genre ${humGenre}`;
  $('genFromHum').style.display='block';
}

buildGenres();renderList();renderPiano();renderChords();initMixerFromMelody();updChords();wireUI();

if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
