<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAPEHEAD</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#121212;color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:#151515;min-height:100vh;border-left:1px solid #222;border-right:1px solid #222}
header{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
.logo span{color:#FF6B35}
nav{display:flex;border-bottom:1px solid #222;margin:0 0 18px}
.tab{flex:1;padding:14px 0;text-align:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#666;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s}
.tab.active{color:#fff;border-color:#FF6B35}
.card{background:#1D1D1F;border:1px solid #2A2A2C;border-radius:20px;margin:0 16px 16px;padding:16px}
.label{font-size:11px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between}
.locked{color:#FF6B35;font-weight:700;display:flex;align-items:center;gap:6px}
.chords{display:flex;align-items:center;gap:10px;background:#151515;border:1px solid #2A2A2C;border-radius:14px;padding:12px;justify-content:space-between}
.chord{width:54px;height:54px;border:1px solid #3A3A3C;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#222;font-size:16px}
.dash{color:#333}
.meta{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:#888}
.meta b{color:#fff;font-size:18px}
.lyric-head{display:flex;justify-content:space-between;align-items:center}
.editor{margin-top:12px;background:#151515;border:1px solid #2A2A2C;border-radius:14px;padding:14px;min-height:260px;position:relative}
.line{display:flex;gap:14px;padding:6px 0;font-size:14px;line-height:1.6}
.num{color:#444;min-width:22px;font-size:12px}
#lyricInput{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;color:transparent;caret-color:#FF6B35;padding:14px 14px 14px 50px;font-family:inherit;font-size:14px;line-height:1.6;outline:none;resize:none;z-index:2}
#lyricDisplay{pointer-events:none;white-space:pre-wrap}
.tools{display:flex;gap:8px;margin:14px 16px;flex-wrap:wrap}
.tbtn{background:#fff;color:#000;border:none;padding:9px 14px;border-radius:100px;font-weight:700;font-size:11px;cursor:pointer}
.tbtn.dark{background:#2A2A2C;color:#fff;border:1px solid #333}
.export{margin:0 16px 30px;background:#FF6B35;color:#fff;border:none;width:calc(100% - 32px);padding:18px;border-radius:14px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.footer{padding:0 16px 20px;display:flex;justify-content:space-between;font-size:11px;color:#666}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">📼 TAPEHEAD</div><div style="display:flex;gap:16px;opacity:0.4">⚙️ 👤</div></header>
<nav><div class="tab active">WRITE</div><div class="tab" onclick="alert('Studio mic - tap mic to record, works on live link')">STUDIO</div><div class="tab" onclick="alert('Publish coming - Export first')">PUBLISH</div></nav>

<div class="card">
<div class="label"><span>Chord Progression</span><span class="locked">🔒 LOCKED</span></div>
<div class="chords"><div class="chord">Am</div><div class="dash">-</div><div class="chord">F</div><div class="dash">-</div><div class="chord">C</div><div class="dash">-</div><div class="chord">G</div></div>
<div class="meta"><span>BPM <b>90</b></span><span>🎵 KEY: Am</span><span>4/4</span></div>
</div>

<div class="card">
<div class="label lyric-head"><span>Lyric Editor</span><span style="color:#FF6B35">⇄ JetBrains Mono</span></div>
<div class="editor" id="editorBox">
<textarea id="lyricInput" placeholder="Type here... [Am - F - C - G] to lock chords"></textarea>
<div id="lyricDisplay"></div>
</div>
</div>

<div class="tools">
<button class="tbtn" onclick="insertTxt('Verse 2:\n')">+ Verse</button>
<button class="tbtn" onclick="insertTxt('Chorus:\n')">+ Chorus</button>
<button class="tbtn dark" onclick="rhyme()">Rhyme Finder</button>
<button class="tbtn dark" onclick="finish()">Line Finisher</button>
</div>

<div class="footer"><span id="count">0 characters • 0 words</span><span style="color:#FF6B35;cursor:pointer" onclick="ai()">💡 AI SUGGEST</span></div>
<button class="export" onclick="exportSong()">⬇ EXPORT</button>
</div>

<script>
const input=document.getElementById('lyricInput');
const display=document.getElementById('lyricDisplay');
const count=document.getElementById('count');
let lyrics=localStorage.getItem('tape_v3')||`Verse 1
I'm chasing quiet in the neon dark
Breathing slow, we tear the silence apart
Hold my breath, watch the city spark
If you stay, I won't fall apart

[Am - F - C - G]
Nze ndi wano, ngenda mu maaso...`;
input.value=lyrics;
function render(){
  const lines=input.value.split('\n');
  let html=''; lines.forEach((l,i)=>{
    const num=String(i+1).padStart(2,'0');
    html+=`<div class="line"><span class="num">${num}</span><span>${l||' '}</span></div>`;
  });
  display.innerHTML=html;
  count.textContent=`${input.value.length} characters • ${input.value.trim().split(/\s+/).filter(Boolean).length} words`;
  localStorage.setItem('tape_v3',input.value);
}
input.addEventListener('input',render);
render();
function insertTxt(t){input.value+=`\n${t}`;render();input.focus();}
function rhyme(){
  const last=input.value.trim().split(/\s+/).pop()||'wano';
  alert(`Rhyme for "${last}":\n• bwino, mpola, omwoyo\n• dark, spark, apart\n• fire, desire, higher`);
}
function finish(){
  const ends=["Nze ndi wano, ng'omukwano gwo", "Omwoyo gwaange gukuyita", "We keep it burning through the night"];
  input.value+=ends[Math.floor(Math.random()*ends.length)]+'\n';render();
}
function ai(){
  input.value+="\nIf you leave, the light goes dark\nBut with you, I find my spark\n";render();
}
function exportSong(){
  const blob=new Blob([input.value],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`TAPEHEAD_${Date.now()}.txt`;
  a.click();
}
</script>
</div>
</body>
</html>
